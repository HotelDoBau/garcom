<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Produtos - Hotel do Baú</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        body {
            margin: 0;
            background: #17212b;
            font-family: Arial, sans-serif;
        }


        .pagina {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
            box-sizing: border-box;
        }


        .topo-pagina {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            background: #17212b;
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }


        .titulo-area h1 {
            margin: 0 0 6px;
            font-size: 26px;
        }


        .titulo-area p {
            margin: 0;
            font-size: 14px;
            opacity: 0.8;
        }


        .botoes-topo {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }


        .botao {
            display: inline-block;
            border: none;
            border-radius: 8px;
            padding: 11px 16px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }


        .botao-voltar {
            background: #ffffff;
            color: #17212b;
        }


        .botao-novo {
            background: #2f80ed;
            color: #ffffff;
        }


        .botao:hover {
            opacity: 0.9;
        }


        .area-produtos {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }


        /* ========================= */
        /* FILTROS */
        /* ========================= */

        .filtros-produtos {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }


        .barra-pesquisa {
            flex: 1;
            width: 100%;
        }


        .barra-pesquisa input {
            width: 100%;
            height: 46px;
            box-sizing: border-box;
            padding: 0 16px;
            border: 1px solid #d5dbe0;
            border-radius: 8px;
            font-size: 16px;
            background: #ffffff;
        }


        .barra-pesquisa input:focus {
            outline: none;
            border-color: #17212b;
        }


        .filtro-categoria {
            width: 240px;
            flex-shrink: 0;
        }


        .filtro-categoria select {
            width: 100%;
            height: 46px;
            box-sizing: border-box;
            padding: 0 12px;
            border: 1px solid #d5dbe0;
            border-radius: 8px;
            background: #ffffff;
            color: #17212b;
            font-size: 14px;
            cursor: pointer;
        }


        .filtro-categoria select:focus {
            outline: none;
            border-color: #17212b;
        }


        /* ========================= */
        /* LISTA DE PRODUTOS */
        /* ========================= */

        .lista-produtos {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }


       
.produto {
    display: flex;
    align-items: center;
    gap: 14px;

    width: 100%;
    min-height: 96px;

    box-sizing: border-box;

    border: 1px solid #3b5368;
    border-radius: 10px;

    padding: 8px 10px;

    background: #243647;

    transition:
        box-shadow 0.15s ease,
        border-color 0.15s ease;
}


        .produto:hover {
            border-color: #cbd3da;
            box-shadow: 0 2px 7px rgba(0, 0, 0, 0.06);
        }


        /* ========================= */
        /* FOTO */
        /* ========================= */

        .produto-imagem,
        .produto-sem-imagem {

            width: 80px;
            height: 80px;

            min-width: 80px;
            min-height: 80px;

            border-radius: 8px;

            object-fit: cover;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #eef1f3;

            color: #7a858f;

            font-size: 12px;

            flex-shrink: 0;
        }


        /* ========================= */
        /* INFORMAÇÕES */
        /* ========================= */

        .produto-conteudo {

            flex: 1;

            min-width: 0;

            display: grid;

            grid-template-columns:
                minmax(180px, 1.5fr)
                minmax(140px, 1fr)
                auto
                auto;

            align-items: center;

            column-gap: 18px;
        }


        .produto-nome {

            margin: 0;

            color: #17212b;

            font-size: 16px;

            font-weight: 700;

            line-height: 1.25;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }


        .produto-descricao {

            margin: 0;

            color: #68737d;

            font-size: 13px;

            line-height: 1.3;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }


        .produto-categoria {

            display: inline-block;

            width: fit-content;

            margin: 0;

            padding: 5px 8px;

            border-radius: 6px;

            background: #eef2f5;

            color: #53606b;

            font-size: 11px;

            font-weight: 600;

            white-space: nowrap;
        }


        .produto-preco {

            color: #17212b;

            font-size: 16px;

            font-weight: 700;

            white-space: nowrap;
        }


        /* ========================= */
        /* BOTÕES */
        /* ========================= */

        .produto-acoes {

            display: flex;

            flex-direction: column;

            gap: 5px;

            width: 78px;

            flex-shrink: 0;
        }


        .botao-editar,
        .botao-excluir {

            width: 100%;

            border: none;

            border-radius: 6px;

            padding: 7px 8px;

            color: white;

            font-size: 12px;

            font-weight: 600;

            cursor: pointer;
        }


        .botao-editar {
            background: #2f80ed;
        }


        .botao-excluir {
            background: #b42318;
        }


        .botao-editar:hover,
        .botao-excluir:hover {
            opacity: 0.9;
        }


        .botao-excluir:disabled {
            opacity: 0.6;
            cursor: wait;
        }


        /* ========================= */
        /* MENSAGEM */
        /* ========================= */

        .mensagem {
            text-align: center;

            padding: 50px 20px;

            color: #68737d;
        }


        .mensagem h2 {
            margin: 0 0 10px;

            color: #17212b;

            font-size: 21px;
        }


        .mensagem p {
            margin: 0;

            font-size: 15px;
        }


        .mensagem.erro {
            color: #b42318;
        }


        /* ========================= */
        /* CELULAR */
        /* ========================= */

        @media (max-width: 700px) {

            .pagina {
                padding: 12px;
            }


            .topo-pagina {
                flex-direction: column;

                align-items: stretch;

                padding: 16px;
            }


            .titulo-area h1 {
                font-size: 23px;
            }


            .botoes-topo {
                width: 100%;

                flex-direction: column;
            }


            .botao {
                width: 100%;

                text-align: center;

                box-sizing: border-box;
            }


            .area-produtos {
                padding: 12px;
            }


            .filtros-produtos {
                flex-direction: column;
                gap: 8px;
            }


            .filtro-categoria {
                width: 100%;
            }


            .produto {
                gap: 10px;

                padding: 7px;
            }


            .produto-imagem,
            .produto-sem-imagem {

                width: 70px;
                height: 70px;

                min-width: 70px;
                min-height: 70px;
            }


            .produto-conteudo {

                display: grid;

                grid-template-columns: 1fr auto;

                grid-template-rows: auto auto auto;

                gap: 4px 8px;
            }


            .produto-nome {

                grid-column: 1 / 3;

                font-size: 14px;
            }


            .produto-descricao {

                grid-column: 1 / 3;

                font-size: 12px;
            }


            .produto-categoria {

                grid-column: 1;

                grid-row: 3;

                font-size: 10px;
            }


            .produto-preco {

                grid-column: 2;

                grid-row: 3;

                font-size: 14px;

                text-align: right;
            }


            .produto-acoes {

                width: 62px;
            }


            .botao-editar,
            .botao-excluir {

                padding: 6px 4px;

                font-size: 10px;
            }

        }

    </style>

</head>


<body>


    <main class="pagina">


        <section class="topo-pagina">


            <div class="titulo-area">

                <h1>
                    Produtos
                </h1>

                <p>
                    Gerencie os produtos do cardápio
                </p>

            </div>


            <div class="botoes-topo">

                <a
                    href="index.html"
                    class="botao botao-voltar"
                >
                    ← Voltar
                </a>


                <a
                    href="produtos.html"
                    class="botao botao-novo"
                >
                    + Novo produto
                </a>

            </div>


        </section>


        <section class="area-produtos">


            <div class="filtros-produtos">


                <div class="barra-pesquisa">

                    <input
                        type="search"
                        id="pesquisaProduto"
                        placeholder="Pesquisar produto..."
                        autocomplete="off"
                    >

                </div>


                <div class="filtro-categoria">

                    <select id="filtroCategoria">

                        <option value="">
                            Todas as categorias
                        </option>

                        <option value="Cafeteria">
                            Cafeteria
                        </option>

                        <option value="Salgados">
                            Salgados
                        </option>

                        <option value="Lanches">
                            Lanches
                        </option>

                        <option value="Pratos Feitos">
                            Pratos Feitos
                        </option>

                        <option value="Bebidas">
                            Bebidas
                        </option>

                        <option value="Cervejas e Vinhos">
                            Cervejas e Vinhos
                        </option>

                        <option value="Adicionais">
                            Adicionais
                        </option>

                        <option value="Doces">
                            Doces
                        </option>

                        <option value="Petiscos">
                            Petiscos
                        </option>

                        <option value="Drinks">
                            Drinks
                        </option>

                        <option value="Outros">
                            Outros
                        </option>

                    </select>

                </div>


            </div>


            <div
                id="listaProdutos"
                class="lista-produtos"
            ></div>


            <div
                id="mensagem"
                class="mensagem"
            >

                <h2>
                    Carregando produtos...
                </h2>

                <p>
                    Aguarde um momento.
                </p>

            </div>


        </section>


    </main>


    <script type="module">

        import {
            db,
            collection,
            getDocs,
            query,
            orderBy,
            deleteDoc,
            doc
        } from "./js/firebase.js";


        const listaProdutos =
            document.getElementById(
                "listaProdutos"
            );


        const mensagem =
            document.getElementById(
                "mensagem"
            );


        const pesquisaProduto =
            document.getElementById(
                "pesquisaProduto"
            );


        const filtroCategoria =
            document.getElementById(
                "filtroCategoria"
            );


        let produtosCarregados = [];


        function formatarPreco(valor) {

            const numero =
                Number(valor) || 0;


            return numero.toLocaleString(
                "pt-BR",
                {
                    style: "currency",
                    currency: "BRL"
                }
            );

        }


        function escaparHTML(valor) {

            return String(valor ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        async function excluirProduto(
            id,
            nome,
            botao
        ) {

            const confirmou =
                confirm(
                    `Deseja realmente excluir o produto "${nome}"?`
                );


            if (!confirmou) {

                return;

            }


            try {

                botao.disabled =
                    true;

                botao.textContent =
                    "Excluindo...";


                await deleteDoc(
                    doc(
                        db,
                        "produtos",
                        id
                    )
                );


                produtosCarregados =
                    produtosCarregados.filter(
                        produto =>
                            produto.id !== id
                    );


                pesquisarProdutos();


            } catch (erro) {

                console.error(
                    "Erro ao excluir produto:",
                    erro
                );


                alert(
                    "Não foi possível excluir o produto."
                );


                botao.disabled =
                    false;

                botao.textContent =
                    "Excluir";

            }

        }


        function editarProduto(id) {

            window.location.href =
                `produtos.html?id=${encodeURIComponent(id)}`;

        }


        function mostrarProdutos(produtos) {

            listaProdutos.innerHTML =
                "";


            if (produtos.length === 0) {

                mensagem.innerHTML = `

                    <h2>
                        Nenhum produto encontrado
                    </h2>

                    <p>
                        Tente alterar a pesquisa ou a categoria.
                    </p>

                `;

                mensagem.style.display =
                    "block";

                return;

            }


            mensagem.style.display =
                "none";


            produtos.forEach(
                produto => {

                    const dados =
                        produto.data
                            ? produto.data()
                            : produto;


                    const id =
                        produto.id;


                    const nomeOriginal =
                        dados.nome || "";


                    const nome =
                        escaparHTML(
                            nomeOriginal
                        );


                    const categoria =
                        escaparHTML(
                            dados.categoria
                        );


                    const descricao =
                        escaparHTML(
                            dados.descricao
                        );


                    const foto =
                        dados.foto || "";


                    const preco =
                        formatarPreco(
                            dados.preco
                        );


                    const card =
                        document.createElement(
                            "article"
                        );


                    card.className =
                        "produto";


                    const imagemHTML =
                        foto
                            ? `
                                <img
                                    class="produto-imagem"
                                    src="${foto}"
                                    alt="${nome}"
                                >
                            `
                            : `
                                <div
                                    class="produto-sem-imagem"
                                >
                                    Sem foto
                                </div>
                            `;


                    card.innerHTML = `

                        ${imagemHTML}


                        <div
                            class="produto-conteudo"
                        >

                            <h2
                                class="produto-nome"
                                title="${nome}"
                            >
                                ${nome}
                            </h2>


                            ${
                                descricao
                                    ? `
                                        <p
                                            class="produto-descricao"
                                            title="${descricao}"
                                        >
                                            ${descricao}
                                        </p>
                                    `
                                    : `
                                        <p
                                            class="produto-descricao"
                                        >
                                            Sem descrição
                                        </p>
                                    `
                            }


                            <span
                                class="produto-categoria"
                            >
                                ${categoria || "Sem categoria"}
                            </span>


                            <div
                                class="produto-preco"
                            >
                                ${preco}
                            </div>

                        </div>


                        <div
                            class="produto-acoes"
                        >

                            <button
                                type="button"
                                class="botao-editar"
                            >
                                Editar
                            </button>


                            <button
                                type="button"
                                class="botao-excluir"
                            >
                                Excluir
                            </button>

                        </div>

                    `;


                    const botaoEditar =
                        card.querySelector(
                            ".botao-editar"
                        );


                    botaoEditar.addEventListener(
                        "click",
                        function () {

                            editarProduto(
                                id
                            );

                        }
                    );


                    const botaoExcluir =
                        card.querySelector(
                            ".botao-excluir"
                        );


                    botaoExcluir.addEventListener(
                        "click",
                        function () {

                            excluirProduto(
                                id,
                                nomeOriginal,
                                botaoExcluir
                            );

                        }
                    );


                    listaProdutos.appendChild(
                        card
                    );

                }
            );

        }


        function pesquisarProdutos() {

            const termo =
                pesquisaProduto.value
                    .trim()
                    .toLowerCase();


            const categoriaSelecionada =
                filtroCategoria.value;


            const produtosFiltrados =
                produtosCarregados.filter(
                    produto => {

                        const dados =
                            produto.data
                                ? produto.data()
                                : produto;


                        const nome =
                            String(
                                dados.nome || ""
                            ).toLowerCase();


                        const categoria =
                            String(
                                dados.categoria || ""
                            );


                        const correspondeNome =
                            !termo ||
                            nome.includes(
                                termo
                            );


                        const correspondeCategoria =
                            !categoriaSelecionada ||
                            categoria ===
                                categoriaSelecionada;


                        return (
                            correspondeNome &&
                            correspondeCategoria
                        );

                    }
                );


            mostrarProdutos(
                produtosFiltrados
            );

        }


        pesquisaProduto.addEventListener(
            "input",
            pesquisarProdutos
        );


        filtroCategoria.addEventListener(
            "change",
            pesquisarProdutos
        );


        async function carregarProdutos() {

            try {

                mensagem.style.display =
                    "block";


                const referencia =
                    collection(
                        db,
                        "produtos"
                    );


                const consulta =
                    query(
                        referencia,
                        orderBy(
                            "nome",
                            "asc"
                        )
                    );


                const resultado =
                    await getDocs(
                        consulta
                    );


                produtosCarregados =
                    resultado.docs;


                mostrarProdutos(
                    produtosCarregados
                );


            } catch (erro) {

                console.error(
                    "Erro ao carregar produtos:",
                    erro
                );


                listaProdutos.innerHTML =
                    "";


                mensagem.className =
                    "mensagem erro";


                mensagem.innerHTML = `

                    <h2>
                        Não foi possível carregar os produtos
                    </h2>

                    <p>
                        Verifique a conexão com o Firebase.
                    </p>

                `;


                mensagem.style.display =
                    "block";

            }

        }


        carregarProdutos();

    </script>


</body>

</html>
