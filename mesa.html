<script>


const numeroMesa =
    localStorage.getItem(
        "mesaSelecionada"
    );


const tipoSelecionado =
    localStorage.getItem(
        "tipoSelecionado"
    ) || "mesa";


const ehQuarto =
    tipoSelecionado === "quarto";


const nomeLocal =
    ehQuarto
        ? "Quarto"
        : "Mesa";


const prefixoLocal =
    ehQuarto
        ? "quarto_"
        : "mesa_";


if (!numeroMesa) {

    window.location.href =
        "index.html";

}


document.getElementById(
    "tituloMesa"
).textContent =

    nomeLocal +
    " " +
    String(numeroMesa)
        .padStart(2, "0");


let pedidosMesa = [];

let totalFechamentoAtual = 0;


/* =========================================
   AGUARDAR FIREBASE
========================================= */

async function aguardarFirebase() {

    let tentativas = 0;


    while (
        !window.firebaseHotel &&
        tentativas < 50
    ) {

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    100
                )
        );

        tentativas++;

    }


    return !!window.firebaseHotel;

}


/* =========================================
   ID DA MESA
========================================= */
function obterIdMesa() {

    return (

        prefixoLocal +

        String(numeroMesa)
            .padStart(2, "0")

    );

}

    
async function aguardarAutenticacaoFirebase() {
    const conectado = await aguardarFirebase();

    if (!conectado) {
        throw new Error("Firebase indisponível.");
    }

    const { auth, onAuthStateChanged } = window.firebaseHotel;

    if (!auth || !onAuthStateChanged) {
        throw new Error("Autenticação do Firebase indisponível.");
    }

    if (auth.currentUser) {
        return auth.currentUser;
    }

    return await new Promise((resolve, reject) => {
        let unsubscribe;

        unsubscribe = onAuthStateChanged(
            auth,
            usuario => {
                unsubscribe();

                if (usuario) {
                    resolve(usuario);
                } else {
                    reject(
                        new Error(
                            "Nenhum usuário autenticado no Firebase."
                        )
                    );
                }
            },
            erro => {
                if (unsubscribe) unsubscribe();
                reject(erro);
            }
        );
    });
}


/* =========================================
   MOSTRAR DADOS DA MESA
========================================= */

function mostrarMesa() {


    const statusMesa =
        document.getElementById(
            "statusMesa"
        );


    const valorMesa =
        document.getElementById(
            "valorMesa"
        );


    const listaConsumo =
        document.getElementById(
            "listaConsumo"
        );


    if (
        pedidosMesa.length === 0
    ) {


        statusMesa.textContent =
            "Livre";


        statusMesa.style.color =
            "#268542";


        valorMesa.textContent =
            "R$ 0,00";


        listaConsumo.innerHTML = `

            <p class="mesa-vazia">

                Nenhum item lançado
                nesta mesa.

            </p>

        `;


        return;

    }


    statusMesa.textContent =
        "Ocupada";


    statusMesa.style.color =
        "#245d88";


    let totalMesa = 0;


    const itensAcumulados = {};


    pedidosMesa.forEach(
        pedido => {


            const itens =
                Array.isArray(
                    pedido.itens
                )
                    ? pedido.itens
                    : [];


            itens.forEach(
                item => {


                    const preco =
                        Number(
                            item.preco || 0
                        );


                    const quantidade =
                        Number(
                            item.quantidade || 0
                        );


                    totalMesa +=
                        preco *
                        quantidade;


                    const chave =
                        String(
                            item.id
                        );


                    if (
                        !itensAcumulados[
                            chave
                        ]
                    ) {


                        itensAcumulados[
                            chave
                        ] = {

                            id:
                                item.id,

                            nome:
                                item.nome,

                            preco:
                                preco,

                            quantidade:
                                0

                        };

                    }


                    itensAcumulados[
                        chave
                    ].quantidade +=
                        quantidade;

                }

            );

        }
    );


    valorMesa.textContent =
        "R$ " +
        totalMesa.toFixed(2);


    listaConsumo.innerHTML =
        "";


    Object.values(
        itensAcumulados
    )
    .forEach(
        item => {


            if (
                item.quantidade <= 0
            ) {

                return;

            }


            const subtotal =
                item.preco *
                item.quantidade;


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "item-consumo";


         div.innerHTML = `

    <div>
        <strong>${item.nome}</strong>

        <small>
            R$ ${item.preco.toFixed(2)} cada
        </small>
    </div>

    <div style="
        display:flex;
        align-items:center;
        gap:10px;
    ">

        <button
            type="button"
            class="btn-diminuir-consumo"
            style="
                width:38px;
                height:38px;
                border:none;
                border-radius:8px;
                font-size:22px;
                font-weight:bold;
                cursor:pointer;
            "
        >−</button>

        <strong style="
            min-width:30px;
            text-align:center;
            font-size:18px;
        ">${item.quantidade}</strong>

        <button
            type="button"
            class="btn-aumentar-consumo"
            style="
                width:38px;
                height:38px;
                border:none;
                border-radius:8px;
                font-size:22px;
                font-weight:bold;
                cursor:pointer;
            "
        >+</button>

        <strong style="
            min-width:85px;
            text-align:right;
        ">R$ ${subtotal.toFixed(2)}</strong>

    </div>

`;

div.querySelector(
    ".btn-diminuir-consumo"
).addEventListener("click", () => {
    alterarConsumo(item.id, -1);
});

div.querySelector(
    ".btn-aumentar-consumo"
).addEventListener("click", () => {
    alterarConsumo(item.id, 1);
});

            listaConsumo.appendChild(
                div
            );

        }
    );

}



/* =========================================
   ALTERAR CONSUMO + AUDITORIA
========================================= */

async function alterarConsumo(
    idProduto,
    variacao
) {

    if (
        variacao !== 1 &&
        variacao !== -1
    ) {
        return;
    }

   let usuarioFirebase;

try {

    usuarioFirebase =
        await aguardarAutenticacaoFirebase();

} catch (erroAutenticacao) {

    console.error(
        "Erro ao confirmar autenticação:",
        erroAutenticacao
    );

    alert(
        "Não foi possível confirmar sua autenticação no Firebase. Verifique seu acesso e tente novamente."
    );

    return;

}

try {
        const {
            db,
            collection,
            getDocs,
            updateDoc,
            deleteDoc,
            addDoc,
            serverTimestamp
        } = window.firebaseHotel;

        // ===========================
        // IDENTIFICAR GARÇOM
        // ===========================

        let garcomNome = "Não informado";
        let garcomUid = usuarioFirebase.uid;
        let usuarioTipo = "garcom";

        try {

            let usuarioSalvo =
                localStorage.getItem("usuarioLogado");

            if (!usuarioSalvo) {
                usuarioSalvo =
                    localStorage.getItem("garcomLogado");
            }

            if (usuarioSalvo) {

                const usuario =
                    JSON.parse(usuarioSalvo);

                garcomNome =
                    usuario.nome ||
                    usuario.nomeGarcom ||
                    usuario.usuario ||
                    "Não informado";

               garcomUid =
    usuario.uid || usuarioFirebase.uid;

                usuarioTipo =
                    usuario.tipo || "garcom";
            }

        } catch (erro) {

            console.error(
                "Erro ao identificar garçom na auditoria:",
                erro
            );

        }

        // ===========================
        // BUSCAR PEDIDOS DA MESA
        // ===========================

        const referenciaMesa =
            collection(
                db,
                "mesas",
                obterIdMesa(),
                "pedidos"
            );

        const snapshot =
            await getDocs(referenciaMesa);

        const documentos = [];

        snapshot.forEach(documento => {

            documentos.push({
                referencia: documento,
                dados: documento.data()
            });

        });

        // Pedido mais recente primeiro.
        documentos.reverse();

        // ===========================
        // LOCALIZAR ITEM E QUANTIDADE
        // ===========================

        let nomeItemAlterado = "";
let quantidadeAnterior = 0;
let quantidadeNova = 0;
let precoItemAlterado = 0;
let removeuCompletamente = false;
let alterado = false;

        for (const registro of documentos) {

            const itens =
                Array.isArray(registro.dados.itens)
                    ? [...registro.dados.itens]
                    : [];

            const indice =
                itens.findIndex(item =>
                    String(item.id) === String(idProduto) &&
                    Number(item.quantidade || 0) > 0
                );

            if (indice === -1) {
                continue;
            }

           const item = itens[indice];

nomeItemAlterado =
    item.nome || "Item sem nome";

precoItemAlterado =
    Number(item.preco || 0);

quantidadeAnterior =
    Number(item.quantidade || 0);

            // ===========================
            // AUMENTAR QUANTIDADE
            // ===========================

            if (variacao === 1) {

                quantidadeNova =
                    quantidadeAnterior + 1;

                item.quantidade =
                    quantidadeNova;

                item.subtotal =
                    Number(item.preco || 0) *
                    quantidadeNova;

            }

            // ===========================
            // DIMINUIR QUANTIDADE
            // ===========================

            if (variacao === -1) {

                quantidadeNova =
                    quantidadeAnterior - 1;

                if (quantidadeNova <= 0) {

                    itens.splice(indice, 1);

                    removeuCompletamente = true;

                } else {

                    item.quantidade =
                        quantidadeNova;

                    item.subtotal =
                        Number(item.preco || 0) *
                        quantidadeNova;

                }

            }

            // ===========================
            // RECALCULAR TOTAL DO PEDIDO
            // ===========================

            const novoTotal =
                itens.reduce(
                    (soma, itemAtual) => {

                        return soma +
                            Number(itemAtual.preco || 0) *
                            Number(itemAtual.quantidade || 0);

                    },
                    0
                );

            // ===========================
            // SALVAR ALTERAÇÃO
            // ===========================

            if (itens.length === 0) {

                await deleteDoc(
                    registro.referencia.ref
                );

            } else {

                await updateDoc(
                    registro.referencia.ref,
                    {
                        itens: itens,
                        total: Number(novoTotal.toFixed(2))
                    }
                );

            }

            alterado = true;

            break;

        }

        if (!alterado) {

            alert(
                "Não foi possível localizar este item na comanda."
            );

            return;

        }

        // ===========================
        // REGISTRAR AUDITORIA
        // ===========================

        let acao = "";
        let descricao = "";

        if (variacao === 1) {

            acao = "Aumentou item";

            descricao =
                "Aumentou " +
                nomeItemAlterado +
                " de " +
                quantidadeAnterior +
                " para " +
                quantidadeNova +
                " unidade(s) na " +
                nomeLocal.toLowerCase() +
                " " +
                String(numeroMesa).padStart(2, "0") +
                ".";

        } else if (removeuCompletamente) {

            acao = "Removeu item";

            descricao =
                "Removeu " +
                nomeItemAlterado +
                " da " +
                nomeLocal.toLowerCase() +
                " " +
                String(numeroMesa).padStart(2, "0") +
                ". A quantidade passou de " +
                quantidadeAnterior +
                " para 0.";

        } else {

            acao = "Diminuiu item";

            descricao =
                "Diminuiu " +
                nomeItemAlterado +
                " de " +
                quantidadeAnterior +
                " para " +
                quantidadeNova +
                " unidade(s) na " +
                nomeLocal.toLowerCase() +
                " " +
                String(numeroMesa).padStart(2, "0") +
                ".";

        }

        try {

            await addDoc(
                collection(db, "auditoria_pedidos"),
                {
                    acao: acao,
                    descricao: descricao,

                    garcomNome: garcomNome,
                    garcomUid: garcomUid,
                    usuarioTipo: usuarioTipo,

                    local:
                        nomeLocal +
                        " " +
                        String(numeroMesa).padStart(2, "0"),

                    tipoLocal: tipoSelecionado,
                    numeroLocal: Number(numeroMesa),
                    comanda: "",

                    itemNome: nomeItemAlterado,

                    quantidade: Math.abs(
                        quantidadeNova - quantidadeAnterior
                    ),

                    quantidadeAnterior: quantidadeAnterior,
                    quantidadeNova: quantidadeNova,

                   valorAlteracao:
    Number(
        (
            variacao *
            precoItemAlterado
        ).toFixed(2)
    ),

                    observacao:
                        "Alteração realizada na tela Ver consumo.",

                    criadoEm: serverTimestamp()
                }
            );

            console.log(
                "Auditoria registrada:",
                acao,
                nomeItemAlterado
            );

        } catch (erroAuditoria) {

            console.error(
                "Erro ao registrar auditoria do consumo:",
                erroAuditoria
            );

            alert(
                "O consumo foi alterado, mas não foi possível registrar a auditoria. Verifique a conexão e as permissões do Firebase."
            );

        }

    } catch (erro) {

        console.error(
            "Erro ao alterar consumo:",
            erro
        );

        alert(
            "Não foi possível alterar o consumo.\n\n" +
            (erro.code || "sem código") +
            "\n\n" +
            (erro.message || erro)
        );

    }

}

/* =========================================
   ESCUTAR PEDIDOS DA MESA
========================================= */

async function iniciarMesa() {


   let usuarioFirebase;

try {

    usuarioFirebase =
        await aguardarAutenticacaoFirebase();

} catch (erroAutenticacao) {

    console.error(
        "Erro ao confirmar autenticação no fechamento:",
        erroAutenticacao
    );

    alert(
        "Não foi possível confirmar sua autenticação no Firebase. Tente novamente."
    );

    return;

}

    const {

        db,
        collection,
        onSnapshot

    } = window.firebaseHotel;


    const referenciaPedidos =
        collection(

            db,

            "mesas",

            obterIdMesa(),

            "pedidos"

        );


    onSnapshot(

        referenciaPedidos,


        snapshot => {


            pedidosMesa = [];


            snapshot.forEach(
                documento => {


                    pedidosMesa.push({

                        id:
                            documento.id,

                        ...documento.data()

                    });

                }
            );


            mostrarMesa();

        },


        erro => {


            console.error(
                "Erro ao carregar mesa:",
                erro
            );


            alert(
                "Não foi possível carregar os pedidos desta mesa."
            );

        }

    );

}

   NOVO PEDIDO

function novoPedido() {

/* =========================================
   VER CONSUMO
========================================= */

function verConsumo() {


    const consumo =
        document.getElementById(
            "consumoMesa"
        );


    consumo.classList.toggle(
        "mostrar"
    );

}


/* =========================================
   CALCULAR TOTAL DA MESA
========================================= */

function calcularTotalMesa() {


    let totalMesa = 0;


    pedidosMesa.forEach(
        pedido => {


            const itens =
                Array.isArray(
                    pedido.itens
                )
                    ? pedido.itens
                    : [];


            itens.forEach(
                item => {


                    const preco =
                        Number(
                            item.preco || 0
                        );


                    const quantidade =
                        Number(
                            item.quantidade || 0
                        );


                    totalMesa +=
                        preco *
                        quantidade;

                }
            );

        }
    );


    return Number(
        totalMesa.toFixed(2)
    );

}


/* =========================================
   ABRIR FECHAMENTO
========================================= */

function fecharMesa() {


    if (
        pedidosMesa.length === 0
    ) {

        alert(
            "Esta mesa não possui consumo."
        );

        return;

    }


    const totalMesa =
        calcularTotalMesa();


    totalFechamentoAtual =
        totalMesa;


    document.getElementById(
        "subtotalFechamento"
    ).textContent =

        "R$ " +
        totalMesa.toFixed(2);


    document.getElementById(
        "descontoFechamento"
    ).value =
        "";


    document.getElementById(
        "totalFechamento"
    ).textContent =

        "R$ " +
        totalMesa.toFixed(2);


    document.getElementById(
        "modalFechamento"
    ).classList.add(
        "mostrar"
    );


    setTimeout(
        () => {


            document.getElementById(
                "descontoFechamento"
            ).focus();


        },
        100
    );

}


/* =========================================
   ATUALIZAR TOTAL COM DESCONTO
========================================= */

document.addEventListener(
    "input",
    function(evento) {


        if (
            evento.target.id !==
            "descontoFechamento"
        ) {

            return;

        }


        let valor =
            evento.target.value;


        valor =
            valor
                .replace(/\./g, "")
                .replace(",", ".");


        let desconto =
            Number(valor);


        if (
            isNaN(desconto) ||
            desconto < 0
        ) {

            desconto = 0;

        }


        if (
            desconto >
            totalFechamentoAtual
        ) {

            desconto =
                totalFechamentoAtual;

        }


        const totalFinal =
            totalFechamentoAtual -
            desconto;


        document.getElementById(
            "totalFechamento"
        ).textContent =

            "R$ " +
            totalFinal.toFixed(2);

    }
);


/* =========================================
   CANCELAR FECHAMENTO

function cancelarFechamento() {

    document.getElementById(
        "modalFechamento"
    ).classList.remove(
        "mostrar"
    );

}

const {

    db,
    doc,
    setDoc,
    serverTimestamp,
    addDoc,
    collection,
    getDocs

} = window.firebaseHotel;


        // ==============================
// IDENTIFICAR RESPONSÁVEL
// ==============================

let garcomNome = "Não informado";
let garcomUid = usuarioFirebase.uid;
let usuarioTipo = "garcom";

try {

    let usuarioSalvo =
        localStorage.getItem("usuarioLogado");

    if (!usuarioSalvo) {
        usuarioSalvo =
            localStorage.getItem("garcomLogado");
    }

    if (usuarioSalvo) {

        const usuario =
            JSON.parse(usuarioSalvo);

        garcomNome =
            usuario.nome ||
            usuario.nomeGarcom ||
            usuario.usuario ||
            "Não informado";

        garcomUid =
            usuario.uid ||
            usuarioFirebase.uid;

        usuarioTipo =
            usuario.tipo ||
            "garcom";
    }

} catch (erroIdentificacao) {

    console.error(
        "Erro ao identificar responsável pelo fechamento:",
        erroIdentificacao
    );

}


        const idMesa =
            obterIdMesa();

        
        // VERIFICAR SE JÁ EXISTE UM FECHAMENTO PENDENTE

        const fechamentosPendentes = await getDocs(
            collection(db, "fechamentos")
        );

        const fechamentoExistente = fechamentosPendentes.docs.find(
            documento => documento.data().idMesa === idMesa
        );

        if (fechamentoExistente) {

            alert(
                "Já existe um fechamento pendente para esta mesa ou quarto. " +
                "Aguarde o processamento antes de tentar novamente."
            );

            return;

        }


        /* ==============================
           MARCA A MESA COMO PAGAMENTO
        ============================== */

        await setDoc(

            doc(
                db,
                "mesas",
                idMesa
            ),

            {

                numero:
                    Number(numeroMesa),

                status:
                    "pagamento",

                atualizadoEm:
                    serverTimestamp()

            },

            {

                merge:
                    true

            }

        );


             /* ==============================
           MONTAR ITENS DO FECHAMENTO
        ============================== */

        const acumulados = {};


        pedidosMesa.forEach(
            pedido => {

                const itens =
                    Array.isArray(
                        pedido.itens
                    )
                        ? pedido.itens
                        : [];


                itens.forEach(
                    item => {

                        const chave =
                            String(
                                item.id
                            );


                        if (
                            !acumulados[chave]
                        ) {

                            acumulados[chave] = {

                                id:
                                    item.id,

                                nome:
                                    item.nome,

                                preco:
                                    Number(
                                        item.preco || 0
                                    ),

                                quantidade:
                                    0

                            };

                        }


                        acumulados[chave].quantidade +=
                            Number(
                                item.quantidade || 0
                            );

                    }

                );

            }
        );


        const itensFechamento =
            Object.values(
                acumulados
            );


        /* ==============================
           CRIAR FECHAMENTO
        ============================== */

        const fechamentoRef =
            await addDoc(

                collection(
                    db,
                    "fechamentos"
                ),

                {

                    mesa:
                        ehQuarto
                            ? null
                            : Number(numeroMesa),

                    quarto:
                        ehQuarto
                            ? Number(numeroMesa)
                            : quartoMesa,

                    tipo:
                        tipoSelecionado,

                    numero:
                        Number(numeroMesa),

                    idMesa:
                        idMesa,

                    itens:
                        itensFechamento,

                    subtotal:
                        Number(
                            totalFechamentoAtual
                                .toFixed(2)
                        ),

                    desconto:
                        Number(
                            desconto.toFixed(2)
                        ),

                    total:
                        totalFinal,

                    dataHora:
                        new Date()
                            .toLocaleString(
                                "pt-BR"
                            ),

                    status:
                        "novo",

                    criadoEm:
                        serverTimestamp()

                }

            );


        /* ==============================
           REGISTRAR SAÍDAS
        ============================== */

        const agora =
            new Date();


        const ano =
            agora.getFullYear();


        const mes =
            String(
                agora.getMonth() + 1
            ).padStart(
                2,
                "0"
            );


        const referenciaMes =
            `${ano}-${mes}`;


       
await addDoc(
    collection(db, "saidas"),
    {
        fechamentoId: fechamentoRef.id,

        mesa: ehQuarto
            ? null
            : Number(numeroMesa),

        quarto: ehQuarto
            ? Number(numeroMesa)
            : quartoMesa,

        tipo: tipoSelecionado,
        numero: Number(numeroMesa),
        idMesa: idMesa,

        itens: itensFechamento.map(item => ({
            id: item.id,
            nome: item.nome,
            valorUnitario: Number(item.preco || 0),
            quantidade: Number(item.quantidade || 0),
            total: Number(
                (
                    Number(item.preco || 0) *
                    Number(item.quantidade || 0)
                ).toFixed(2)
            )
        })),

        referenciaMes: referenciaMes,

        subtotal: Number(
            totalFechamentoAtual.toFixed(2)
        ),

        desconto: Number(
            desconto.toFixed(2)
        ),

        total: Number(
            totalFinal.toFixed(2)
        ),

        dataHora: new Date().toLocaleString("pt-BR"),

        criadoEm: serverTimestamp()
    }
);



                /* ==============================
           AUDITORIA DO FECHAMENTO
        ============================== */

        try {

            await addDoc(
                collection(
                    db,
                    "auditoria_pedidos"
                ),
                {
                    acao: "Fechou conta",

                    descricao:
                        garcomNome +
                        " fechou " +
                        nomeLocal.toLowerCase() +
                        " " +
                        String(numeroMesa).padStart(2, "0") +
                        ". Consumo: R$ " +
                        totalFechamentoAtual.toFixed(2) +
                        "; desconto: R$ " +
                        desconto.toFixed(2) +
                        "; total final: R$ " +
                        totalFinal.toFixed(2) +
                        ".",

                    garcomNome: garcomNome,
                    garcomUid: garcomUid,
                    usuarioTipo: usuarioTipo,

                    local:
                        nomeLocal +
                        " " +
                        String(numeroMesa).padStart(2, "0"),

                    tipoLocal: tipoSelecionado,
                    numeroLocal: Number(numeroMesa),

                    comanda: "",

                    fechamentoId: fechamentoRef.id,

                    itens: itensFechamento.map(item => ({
                        id: item.id,
                        nome: item.nome,
                        preco: Number(item.preco || 0),
                        quantidade: Number(item.quantidade || 0),
                        subtotal: Number(
                            (
                                Number(item.preco || 0) *
                                Number(item.quantidade || 0)
                            ).toFixed(2)
                        )
                    })),

                    subtotal: Number(
                        totalFechamentoAtual.toFixed(2)
                    ),

                    desconto: Number(
                        desconto.toFixed(2)
                    ),

                    total: totalFinal,

                    observacao:
                        "Fechamento enviado para impressão.",

                    criadoEm: serverTimestamp()
                }
            );

            console.log(
                "Auditoria do fechamento registrada:",
                fechamentoRef.id
            );

        } catch (erroAuditoria) {

            console.error(
                "Erro ao registrar auditoria do fechamento:",
                erroAuditoria
            );

            alert(
                "O fechamento foi criado, mas a auditoria não foi registrada. Verifique as permissões do Firebase."
            );

        }
        
                /* ==============================
           FINALIZAR FECHAMENTO
        ============================== */

        document.getElementById(
            "modalFechamento"
        ).classList.remove(
            "mostrar"
        );


        alert(

            "✅ Fechamento do " +

            nomeLocal +

            " " +

            String(numeroMesa)
                .padStart(2, "0") +

            " enviado para o computador.\n\n" +

            "Total a pagar: R$ " +

            totalFinal.toFixed(2) +

            "\n\nO atendimento ficará em PAGAMENTO até a conta ser impressa."

        );


        window.location.href =
            "index.html";


    }


    
    catch (erro) {

        console.error(
            "Erro ao enviar fechamento:",
            erro
        );

        alert(
            "❌ Não foi possível enviar o fechamento.\n\n" +
            (erro.code || "sem código") +
            "\n\n" +
            (erro.message || erro)
        );

    } finally {

        window.fechamentoEmProcessamento = false;

    }

}



/* =========================================
   VOLTAR
========================================= */

function voltarMesas() {

    window.location.href =
        "index.html";

}


/* =========================================
   INICIAR
========================================= */

iniciarMesa();


</script>

</html>
