<script
    type="module"

<script>


const numeroMesa =
    localStorage.getItem(
        "mesaSelecionada"
    );


const tipoSelecionado =
    localStorage.getItem(
        "tipoSelecionado"
    ) || "mesa";


const ehQuarto =
    tipoSelecionado === "quarto";


const nomeLocal =
    ehQuarto
        ? "Quarto"
        : "Mesa";


const prefixoLocal =
    ehQuarto
        ? "quarto_"
        : "mesa_";


if (!numeroMesa) {

    window.location.href =
        "index.html";

}


document.getElementById(
    "tituloMesa"
).textContent =

    nomeLocal +
    " " +
    String(numeroMesa)
        .padStart(2, "0");


let pedidosMesa = [];

let totalFechamentoAtual = 0;

let fechamentoPendenteAtual = null;
    
/* =========================================
   AGUARDAR FIREBASE
========================================= */

async function aguardarFirebase() {

    let tentativas = 0;


    while (
        !window.firebaseHotel &&
        tentativas < 50
    ) {

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    100
                )
        );

        tentativas++;

    }


    return !!window.firebaseHotel;

}


/* =========================================
   ID DA MESA
========================================= */
function obterIdMesa() {

    return (

        prefixoLocal +

        String(numeroMesa)
            .padStart(2, "0")

    );

}

    
async function aguardarAutenticacaoFirebase() {
    const conectado = await aguardarFirebase();

    if (!conectado) {
        throw new Error("Firebase indisponível.");
    }

    const { auth, onAuthStateChanged } = window.firebaseHotel;

    if (!auth || !onAuthStateChanged) {
        throw new Error("Autenticação do Firebase indisponível.");
    }

    if (auth.currentUser) {
        return auth.currentUser;
    }

    return await new Promise((resolve, reject) => {
        let unsubscribe;

        unsubscribe = onAuthStateChanged(
            auth,
            usuario => {
                unsubscribe();

                if (usuario) {
                    resolve(usuario);
                } else {
                    reject(
                        new Error(
                            "Nenhum usuário autenticado no Firebase."
                        )
                    );
                }
            },
            erro => {
                if (unsubscribe) unsubscribe();
                reject(erro);
            }
        );
    });
}






/* =========================================
   ALTERAR CONSUMO + AUDITORIA
========================================= */

async function alterarConsumo(
    idProduto,
    variacao
) {

    if (
        variacao !== 1 &&
        variacao !== -1
    ) {
        return;
    }

    
    if (fechamentoPendenteAtual) {
        alert(
            "Não é possível alterar o consumo enquanto houver um fechamento pendente. Aguarde a conclusão ou solicite a correção do fechamento."
        );

        return;
    }


   let usuarioFirebase;

try {

    usuarioFirebase =
        await aguardarAutenticacaoFirebase();

} catch (erroAutenticacao) {

    console.error(
        "Erro ao confirmar autenticação:",
        erroAutenticacao
    );

    alert(
        "Não foi possível confirmar sua autenticação no Firebase. Verifique seu acesso e tente novamente."
    );

    return;

}

try {
        const {
    db,
    collection,
    getDocs,
    getDoc,
    runTransaction,        
    doc,
    updateDoc,
    deleteDoc,
    addDoc,
    serverTimestamp
} = window.firebaseHotel;

    const referenciaDocumentoMesa = doc(
    db,
    "mesas",
    obterIdMesa()
);

const documentoMesa = await getDoc(
    referenciaDocumentoMesa
);

if (
    documentoMesa.exists() &&
    String(
        documentoMesa.data().status || ""
    ).toLowerCase() === "pagamento"
) {
    alert(
        "Esta mesa está em processo de fechamento. Não é possível alterar o consumo."
    );

    return;
}

        // ===========================
        // IDENTIFICAR GARÇOM
        // ===========================

        let garcomNome = "Não informado";
        let garcomUid = usuarioFirebase.uid;
        let usuarioTipo = "garcom";

        try {

            let usuarioSalvo =
                localStorage.getItem("usuarioLogado");

            if (!usuarioSalvo) {
                usuarioSalvo =
                    localStorage.getItem("garcomLogado");
            }

            if (usuarioSalvo) {

                const usuario =
                    JSON.parse(usuarioSalvo);

                garcomNome =
                    usuario.nome ||
                    usuario.nomeGarcom ||
                    usuario.usuario ||
                    "Não informado";

               garcomUid =
    usuario.uid || usuarioFirebase.uid;

                usuarioTipo =
                    usuario.tipo || "garcom";
            }

        } catch (erro) {

            console.error(
                "Erro ao identificar garçom na auditoria:",
                erro
            );

        }

       

// ===========================
// BUSCAR E ALTERAR PEDIDO
// COM TRANSAÇÃO DO FIRESTORE
// ===========================

const referenciaMesa = collection(
    db,
    "mesas",
    obterIdMesa(),
    "pedidos"
);

let nomeItemAlterado = "";
let quantidadeAnterior = 0;
let quantidadeNova = 0;
let precoItemAlterado = 0;
let removeuCompletamente = false;
let alterado = false;

// Buscar os pedidos antes da transação.
// A leitura da coleção não pode ser feita com
// transaction.get().
const snapshotPedidos = await getDocs(
    referenciaMesa
);

const referenciasPedidos = [
    ...snapshotPedidos.docs
].reverse().map(documento => documento.ref);

const resultadoTransacao = await runTransaction(
    db,
    async (transaction) => {

        // Verificar o status atual da mesa.
        const mesaAtual = await transaction.get(
            referenciaDocumentoMesa
        );

        if (
            mesaAtual.exists() &&
            String(
                mesaAtual.data().status || ""
            ).toLowerCase() === "pagamento"
        ) {
            return {
                status: "pagamento"
            };
        }

        // Ler os documentos individualmente
        // dentro da transação.
        const documentos = [];

        for (const referencia of referenciasPedidos) {
            const documento = await transaction.get(
                referencia
            );

            if (documento.exists()) {
                documentos.push(documento);
            }
        }

        // Procurar o item no pedido mais recente.
        for (
            let i = documentos.length - 1;
            i >= 0;
            i--
        ) {

            const registro = documentos[i];
            const dadosPedido = registro.data();

            const itens = Array.isArray(dadosPedido.itens)
                ? [...dadosPedido.itens]
                : [];

            const indice = itens.findIndex(item =>
                String(item.id) === String(idProduto) &&
                Number(item.quantidade || 0) > 0
            );

            if (indice === -1) {
                continue;
            }

            const item = { ...itens[indice] };

            const nome = item.nome || "Item sem nome";
            const preco = Number(item.preco || 0);
            const anterior = Number(item.quantidade || 0);

            let nova = anterior;
            let removeu = false;

            if (variacao === 1) {

                nova = anterior + 1;

                item.quantidade = nova;
                item.subtotal = Number(
                    (preco * nova).toFixed(2)
                );

                itens[indice] = item;

            } else {

                nova = anterior - 1;

                if (nova <= 0) {

                    itens.splice(indice, 1);
                    removeu = true;

                } else {

                    item.quantidade = nova;
                    item.subtotal = Number(
                        (preco * nova).toFixed(2)
                    );

                    itens[indice] = item;
                }
            }

            const novoTotal = itens.reduce(
                (soma, itemAtual) =>
                    soma +
                    Number(itemAtual.preco || 0) *
                    Number(itemAtual.quantidade || 0),
                0
            );

            if (itens.length === 0) {

                transaction.delete(registro.ref);

            } else {

                transaction.update(
                    registro.ref,
                    {
                        itens: itens,
                        total: Number(novoTotal.toFixed(2))
                    }
                );
            }

            return {
                status: "alterado",
                nome: nome,
                anterior: anterior,
                nova: nova,
                preco: preco,
                removeu: removeu
            };
        }

        return {
            status: "nao-encontrado"
        };
    }
);


        // ===========================
        // TRATAR RESULTADO
        // FORA DA TRANSAÇÃO
        // ===========================

        if (
            resultadoTransacao.status === "pagamento"
        ) {

            alert(
                "Esta mesa está em processo de fechamento. Não é possível alterar o consumo."
            );

            return;

        }

        if (
            resultadoTransacao.status === "nao-encontrado"
        ) {

            alert(
                "Não foi possível localizar este item na comanda."
            );

            return;

        }

        nomeItemAlterado =
            resultadoTransacao.nome;

        quantidadeAnterior =
            resultadoTransacao.anterior;

        quantidadeNova =
            resultadoTransacao.nova;

        precoItemAlterado =
            resultadoTransacao.preco;

        removeuCompletamente =
            resultadoTransacao.removeu;

        alterado = true;

        if (!alterado) {

            alert(
                "Não foi possível alterar o consumo."
            );

            return;

        }

        // ===========================
        // REGISTRAR AUDITORIA
        // ===========================

        let acao = "";
        let descricao = "";

        if (variacao === 1) {

            acao = "Aumentou item";

            descricao =
                "Aumentou " +
                nomeItemAlterado +
                " de " +
                quantidadeAnterior +
                " para " +
                quantidadeNova +
                " unidade(s) na " +
                nomeLocal.toLowerCase() +
                " " +
                String(numeroMesa).padStart(2, "0") +
                ".";

        } else if (removeuCompletamente) {

            acao = "Removeu item";

            descricao =
                "Removeu " +
                nomeItemAlterado +
                " da " +
                nomeLocal.toLowerCase() +
                " " +
                String(numeroMesa).padStart(2, "0") +
                ". A quantidade passou de " +
                quantidadeAnterior +
                " para 0.";

        } else {

            acao = "Diminuiu item";

            descricao =
                "Diminuiu " +
                nomeItemAlterado +
                " de " +
                quantidadeAnterior +
                " para " +
                quantidadeNova +
                " unidade(s) na " +
                nomeLocal.toLowerCase() +
                " " +
                String(numeroMesa).padStart(2, "0") +
                ".";

        }

        try {

            await addDoc(
                collection(db, "auditoria_pedidos"),
                {
                    acao: acao,
                    descricao: descricao,

                    garcomNome: garcomNome,
                    garcomUid: garcomUid,
                    usuarioTipo: usuarioTipo,

                    local:
                        nomeLocal +
                        " " +
                        String(numeroMesa).padStart(2, "0"),

                    tipoLocal: tipoSelecionado,
                    numeroLocal: Number(numeroMesa),
                    comanda: "",

                    itemNome: nomeItemAlterado,

                    quantidade: Math.abs(
                        quantidadeNova - quantidadeAnterior
                    ),

                    quantidadeAnterior: quantidadeAnterior,
                    quantidadeNova: quantidadeNova,

                   valorAlteracao:
    Number(
        (
            variacao *
            precoItemAlterado
        ).toFixed(2)
    ),

                    observacao:
                        "Alteração realizada na tela Ver consumo.",

                    criadoEm: serverTimestamp()
                }
            );

            console.log(
                "Auditoria registrada:",
                acao,
                nomeItemAlterado
            );

        } catch (erroAuditoria) {

            console.error(
                "Erro ao registrar auditoria do consumo:",
                erroAuditoria
            );

            alert(
                "O consumo foi alterado, mas não foi possível registrar a auditoria. Verifique a conexão e as permissões do Firebase."
            );

        }

    } catch (erro) {

        console.error(
            "Erro ao alterar consumo:",
            erro
        );

        alert(
            "Não foi possível alterar o consumo.\n\n" +
            (erro.code || "sem código") +
            "\n\n" +
            (erro.message || erro)
        );

    }

}

/* =========================================
   ESCUTAR PEDIDOS DA MESA
========================================= */

async function iniciarMesa() {


   let usuarioFirebase;

try {

    usuarioFirebase =
        await aguardarAutenticacaoFirebase();


} catch (erroAutenticacao) {

    console.error(
        "Erro ao confirmar autenticação no fechamento:",
        erroAutenticacao
    );

    alert(
        "Não foi possível confirmar sua autenticação no Firebase. Tente novamente."
    );

    window.fechamentoEmProcessamento = false;

    return;

}


   
const {
    db,
    collection,
    onSnapshot,
    getDocs
} = window.firebaseHotel;

    const referenciaPedidos =
        collection(

            db,

            "mesas",

            obterIdMesa(),

            "pedidos"

        );


    onSnapshot(

        referenciaPedidos,


        snapshot => {


            pedidosMesa = [];


            snapshot.forEach(
                documento => {


                    pedidosMesa.push({

                        id:
                            documento.id,

                        ...documento.data()

                    });

                }
            );


            mostrarMesa();

        },


        erro => {


            console.error(
                "Erro ao carregar mesa:",
                erro
            );


            alert(
                "Não foi possível carregar os pedidos desta mesa."
            );

        }

    );



    
    /* =========================================
       ESCUTAR FECHAMENTOS DA MESA
    ========================================= */

    const referenciaFechamentos =
        collection(db, "fechamentos");

    onSnapshot(
        referenciaFechamentos,

        snapshot => {

            fechamentoPendenteAtual = null;

            snapshot.forEach(documento => {

                const fechamento = documento.data();

                const statusFechamento =
                    String(fechamento.status || "")
                        .toLowerCase();

                const encerrado =
                    [
                        "concluido",
                        "finalizado",
                        "fechado"
                    ].includes(statusFechamento);

                if (
                    fechamento.idMesa === obterIdMesa() &&
                    !encerrado
                ) {

                    fechamentoPendenteAtual = {
                        id: documento.id,
                        ...fechamento
                    };

                }

            });

            mostrarMesa();

        },

        erro => {

            console.error(
                "Erro ao monitorar fechamentos:",
                erro
            );

        }
    );

    }

/* =========================================

    );

/* =========================================
   CALCULAR TOTAL DA MESA
========================================= */

function calcularTotalMesa() {


    let totalMesa = 0;


    pedidosMesa.forEach(
        pedido => {


            const itens =
                Array.isArray(
                    pedido.itens
                )
                    ? pedido.itens
                    : [];


            itens.forEach(
                item => {


                    const preco =
                        Number(
                            item.preco || 0
                        );


                    const quantidade =
                        Number(
                            item.quantidade || 0
                        );


                    totalMesa +=
                        preco *
                        quantidade;

                }
            );

        }
    );


    return Number(
        totalMesa.toFixed(2)
    );

}

    

    
/* =========================================
   MOSTRAR DADOS DA MESA
========================================= */

function mostrarMesa() {

    const statusMesa =
        document.getElementById("statusMesa");

    const valorMesa =
        document.getElementById("valorMesa");

    const listaConsumo =
        document.getElementById("listaConsumo");

    const botaoFecharMesa =
        document.getElementById("botaoFecharMesa");

    // Verificar se os elementos existem.
    if (!statusMesa || !valorMesa || !listaConsumo) {
        console.error(
            "Não foi possível exibir a mesa: elementos do HTML não encontrados."
        );
        return;
    }

    // Definir o status da mesa.
    if (fechamentoPendenteAtual) {

        statusMesa.textContent = "Pagamento";
        statusMesa.style.color = "#d97706";

        if (botaoFecharMesa) {
            botaoFecharMesa.textContent =
                "Confirmar Fechamento";
        }

    } else if (pedidosMesa.length === 0) {

        statusMesa.textContent = "Livre";
        statusMesa.style.color = "#268542";

        if (botaoFecharMesa) {
            botaoFecharMesa.textContent =
                "💰 Fechar mesa";
        }

        valorMesa.textContent = "R$ 0,00";

        listaConsumo.innerHTML = `
            <p class="mesa-vazia">
                Nenhum item lançado nesta mesa.
            </p>
        `;

        return;

    } else {

        statusMesa.textContent = "Ocupada";
        statusMesa.style.color = "#245d88";

        if (botaoFecharMesa) {
            botaoFecharMesa.textContent =
                "💰 Fechar mesa";
        }
    }

    // Agrupar os itens iguais.
    const itensAcumulados = {};

    pedidosMesa.forEach(pedido => {

        const itens = Array.isArray(pedido.itens)
            ? pedido.itens
            : [];

        itens.forEach(item => {

            const id = String(item.id);
            const preco = Number(item.preco || 0);
            const quantidade = Number(item.quantidade || 0);

            if (quantidade <= 0) {
                return;
            }

            if (!itensAcumulados[id]) {
                itensAcumulados[id] = {
                    id: item.id,
                    nome: item.nome || "Item sem nome",
                    preco: preco,
                    quantidade: 0
                };
            }

            itensAcumulados[id].quantidade += quantidade;
        });
    });

    // Atualizar o total.
    valorMesa.textContent =
        "R$ " + calcularTotalMesa().toFixed(2);

    // Renderizar a lista de consumo.
    listaConsumo.innerHTML = "";

    Object.values(itensAcumulados).forEach(item => {

        const subtotal = item.preco * item.quantidade;
        const div = document.createElement("div");

        div.className = "item-consumo";

        div.innerHTML = `
            <div>
                <strong></strong>
                <small></small>
            </div>

            <div style="
                display:flex;
                align-items:center;
                gap:10px;
            ">
                <button
                    type="button"
                    class="btn-diminuir-consumo"
                    style="
                        width:38px;
                        height:38px;
                        border:none;
                        border-radius:8px;
                        font-size:22px;
                        font-weight:bold;
                        cursor:pointer;
                    "
                >−</button>

                <strong style="
                    min-width:30px;
                    text-align:center;
                    font-size:18px;
                "></strong>

                <button
                    type="button"
                    class="btn-aumentar-consumo"
                    style="
                        width:38px;
                        height:38px;
                        border:none;
                        border-radius:8px;
                        font-size:22px;
                        font-weight:bold;
                        cursor:pointer;
                    "
                >+</button>

                <strong style="
                    min-width:85px;
                    text-align:right;
                "></strong>
            </div>
        `;

        const textos = div.querySelectorAll("strong");
        const detalhes = div.querySelectorAll("small");

        textos[0].textContent = item.nome;
        detalhes[0].textContent =
            "R$ " + item.preco.toFixed(2) + " cada";

        textos[1].textContent = item.quantidade;
        textos[2].textContent =
            "R$ " + subtotal.toFixed(2);

        div.querySelector(
            ".btn-diminuir-consumo"
        ).addEventListener("click", () => {
            alterarConsumo(item.id, -1);
        });

        div.querySelector(
            ".btn-aumentar-consumo"
        ).addEventListener("click", () => {
            alterarConsumo(item.id, 1);
        });

        listaConsumo.appendChild(div);
    });
}



/* =========================================
   ABRIR FECHAMENTO
========================================= */


function fecharMesa() {

    // Se já existe um fechamento pendente,
    // encaminha para a confirmação final.
    if (fechamentoPendenteAtual) {

        confirmarFechamento();

        return;

    }

    if (pedidosMesa.length === 0) {

        alert(
            "Esta mesa não possui consumo."
        );

        return;

    }

    const totalMesa =

    ).classList.add("mostrar");

            "descontoFechamento"
        ).focus();

/* =========================================
   ATUALIZAR TOTAL COM DESCONTO
========================================= */

document.addEventListener(
    "input",
    function(evento) {


        if (
            evento.target.id !==
            "descontoFechamento"
        ) {

            return;

        }


        let valor =
            evento.target.value;


        valor =
            valor
                .replace(/\./g, "")
                .replace(",", ".");


        let desconto =
            Number(valor);


        if (
            isNaN(desconto) ||
            desconto < 0
        ) {

            desconto = 0;

        }


        if (
            desconto >
            totalFechamentoAtual
        ) {

            desconto =
                totalFechamentoAtual;

        }


        const totalFinal =
            totalFechamentoAtual -
            desconto;


        document.getElementById(
            "totalFechamento"
        ).textContent =

            "R$ " +
            totalFinal.toFixed(2);

    }
);

    if (window.fechamentoEmProcessamento) {
        return;
    }

    // =========================================

if (fechamentoPendenteAtual) {

    try {

        const usuarioFirebase =
            await aguardarAutenticacaoFirebase();

        const {
            db,
            doc,
            collection,
            getDocs,
            getDoc,
            deleteDoc,
            updateDoc,
            setDoc,
            serverTimestamp
        } = window.firebaseHotel;

        const fechamento =
            fechamentoPendenteAtual;

        const referenciaFechamento =
            doc(
                db,
                "fechamentos",
                fechamento.id
            );

        // Conferir novamente o fechamento no Firebase.
        const fechamentoSnapshot =
            await getDoc(referenciaFechamento);

        if (!fechamentoSnapshot.exists()) {

            alert(
                "O fechamento não foi encontrado no Firebase. " +
                "Nenhum pedido foi excluído."
            );

            return;
        }

        const dadosFechamento =
            fechamentoSnapshot.data();

        const idMesa =
            obterIdMesa();

        // Confirmar que o fechamento pertence a esta mesa ou quarto.
        if (dadosFechamento.idMesa !== idMesa) {

            alert(
                "O fechamento não corresponde a esta mesa ou quarto. " +
                "Nenhum pedido foi excluído."
            );

            return;
        }

        // Só prosseguir se a impressão estiver confirmada.
        if (
            String(dadosFechamento.status || "")
                .toLowerCase() !== "impresso"
        ) {

            alert(
                "A conta ainda não foi confirmada como impressa. " +
                "Aguarde a impressão antes de finalizar o atendimento."
            );

            return;
        }

        const confirmarFinal =
            confirm(
                "A conta já foi impressa.\n\n" +
                "Deseja confirmar o fechamento de " +
                nomeLocal + " " +
                String(numeroMesa).padStart(2, "0") +
                " e liberar o atendimento?"
            );

        if (!confirmarFinal) {
            return;
        }

        // Buscar os pedidos deste atendimento.
        const referenciaPedidos =
            collection(
                db,
                "mesas",
                idMesa,
                "pedidos"
            );

        const pedidosAtuais =
            await getDocs(referenciaPedidos);

        // PRIMEIRO: preservar cada pedido completo na auditoria.
        // Nenhum pedido original será excluído nesta etapa.
        for (const pedido of pedidosAtuais.docs) {

            const referenciaAuditoriaPedido =
                doc(
                    db,
                    "auditoria_pedidos",
                    "fechamento_final_" +
                    fechamento.id +
                    "_pedido_" +
                    pedido.id
                );

            // Evitar recriar uma cópia que já foi preservada
            // em uma tentativa anterior de finalização.
            const auditoriaExistente =
                await getDoc(
                    referenciaAuditoriaPedido
                );

            if (!auditoriaExistente.exists()) {

                await setDoc(
                    referenciaAuditoriaPedido,
                    {
                        acao: "Preservou pedido do fechamento",

                        descricao:
                            "Cópia integral do pedido antes da liberação do atendimento.",

                        fechamentoId: fechamento.id,
                        idMesa: idMesa,
                        pedidoIdOriginal: pedido.id,

                        // Documento original completo.
                        dadosPedido: pedido.data(),

                        garcomNome:
                            dadosFechamento.garcomNome ||
                            fechamento.garcomNome ||
                            "Não informado",

                        usuarioUid: usuarioFirebase.uid,

                        criadoEm: serverTimestamp()
                    }
                );

            }

        }

        // SEGUNDO: somente após preservar todos os pedidos,
        // excluir os documentos originais deste atendimento.
        for (const pedido of pedidosAtuais.docs) {

            await deleteDoc(pedido.ref);

        }

        // TERCEIRO: registrar a confirmação final.
        const referenciaAuditoriaFinal =
            doc(
                db,
                "auditoria_pedidos",
                "fechamento_final_" + fechamento.id
            );

        const auditoriaFinalExistente =
            await getDoc(
                referenciaAuditoriaFinal
            );

        if (!auditoriaFinalExistente.exists()) {

            await setDoc(
                referenciaAuditoriaFinal,
                {
                    acao: "Confirmou fechamento",

                    descricao:
                        "Fechamento confirmado após a impressão.",

                    fechamentoId: fechamento.id,
                    idMesa: idMesa,

                    garcomNome:
                        dadosFechamento.garcomNome ||
                        fechamento.garcomNome ||
                        "Não informado",

                    usuarioUid: usuarioFirebase.uid,

                    criadoEm: serverTimestamp()
                }
            );

        }

      
        // QUARTO: concluir o fechamento e liberar a mesa
        // em uma única transação do Firebase.
        const { runTransaction } = window.firebaseHotel;

        await runTransaction(db, async (transaction) => {

            // Conferir novamente o fechamento dentro da transação.
            const fechamentoAtual =
                await transaction.get(referenciaFechamento);

            if (!fechamentoAtual.exists()) {
                throw new Error(
                    "O fechamento não existe mais no Firebase."
                );
            }

            const dadosAtuais = fechamentoAtual.data();

            if (dadosAtuais.idMesa !== idMesa) {
                throw new Error(
                    "O fechamento não pertence a esta mesa ou quarto."
                );
            }

            if (
                String(dadosAtuais.status || "").toLowerCase()
                !== "impresso"
            ) {
                throw new Error(
                    "O fechamento não está confirmado como impresso."
                );
            }

            // Só libera a mesa se a validação passar.
            transaction.set(
                doc(db, "mesas", idMesa),
                {
                    numero: Number(numeroMesa),
                    status: "livre",
                    atualizadoEm: serverTimestamp()
                },
                { merge: true }
            );

            // Conclui o fechamento na mesma transação.
            transaction.update(
                referenciaFechamento,
                {
                    status: "concluido",
                    concluidoEm: serverTimestamp()
                }
            );

        });

        fechamentoPendenteAtual = null;

        alert(
            "Fechamento confirmado. Atendimento liberado."
        );

        window.location.href = "index.html";

        return;

    } catch (erroFinalizacao) {

        console.error(
            "Erro ao confirmar fechamento:",
            erroFinalizacao
        );

        alert(
            "Não foi possível concluir o atendimento.\n\n" +
            "Verifique a conexão e a auditoria antes de tentar novamente.\n\n" +
            (erroFinalizacao.message || erroFinalizacao)
        );

    } finally {

        window.fechamentoEmProcessamento = false;

    }

    return;

}
