<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Saídas - Hotel do Baú</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        /* =========================================
           PÁGINA
        ========================================= */

        .saidas-page {
            padding-bottom: 40px;
        }


        .saidas-page main {
            width: 100%;
            max-width: none;
            margin: 0;
            padding: 0;
        }


        /* =========================================
           FILTROS
        ========================================= */

        .filtro-saidas {

            margin: 20px auto;

            padding: 20px;

            max-width: 1100px;

            background: white;

            border-radius: 14px;

            box-shadow:
                0 3px 12px
                rgba(0,0,0,0.08);

        }


        .filtro-saidas label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;

        }


        .filtro-saidas select,
        .filtro-saidas input {

            width: 100%;

            padding: 12px;

            border-radius: 8px;

            border: 1px solid #ccc;

            font-size: 16px;

            box-sizing: border-box;

        }


        .filtro-saidas input {

            margin-top: 0;

        }


        .campo-busca {

            margin-top: 18px;

        }


        /* =========================================
           RESUMO
        ========================================= */

       .resumo-saidas {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
    margin: 20px 0;
}

.resumo-saidas > div {
    background-color: #17212b !important;
color: #ffffff !important;
    background: #17212b;
    border: 1px solid #344454;
    border-radius: 12px;
    padding: 18px 14px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 10px;
    min-width: 0;
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
}

.resumo-saidas span {
    color: #cbd5df !important;
    color: #cbd5df;
    font-size: 13px;
    line-height: 1.4;
}

.resumo-saidas strong {
    color: #ffffff !important;
    display: block;
    color: #ffffff;
    font-size: 23px;
    font-weight: 700;
    line-height: 1.3;
    overflow-wrap: anywhere;
}

@media (max-width: 600px) {
    .resumo-saidas {
        grid-template-columns: 1fr;
        gap: 10px;
    }

    .resumo-saidas > div {
        padding: 15px;
    }

    .resumo-saidas strong {
        font-size: 22px;
    }
}


        /* =========================================
           TABELA
        ========================================= */

        .tabela-saidas-container {

            width: 100%;

            max-width: none;

            margin: 20px 0;

            overflow-x: auto;

            background: white;

            border-radius: 14px;

            box-shadow:
                0 3px 12px
                rgba(0,0,0,0.08);

        }


        .tabela-saidas {

            width: 100%;

            min-width: 100%;

            border-collapse: collapse;

            table-layout: fixed;

        }


        .tabela-saidas th:nth-child(1),
        .tabela-saidas td:nth-child(1) {
            width: 34%;
        }


        .tabela-saidas th:nth-child(2),
        .tabela-saidas td:nth-child(2) {
            width: 19%;
        }


        .tabela-saidas th:nth-child(3),
        .tabela-saidas td:nth-child(3) {
            width: 13%;
        }


        .tabela-saidas th:nth-child(4),
        .tabela-saidas td:nth-child(4) {
            width: 9%;
        }


        .tabela-saidas th:nth-child(5),
        .tabela-saidas td:nth-child(5) {
            width: 15%;
        }


        .tabela-saidas th:nth-child(6),
        .tabela-saidas td:nth-child(6) {
            width: 10%;
        }


        .tabela-saidas th {

            background: #245d88;

            color: white;

            padding: 12px;

            text-align: left;

            white-space: nowrap;

        }


        
.tabela-saidas td {

    padding: 11px 12px;

    border-bottom: 1px solid #eee;

    color: #17212b;
}



        .tabela-saidas tr:last-child td {

            border-bottom: none;

        }


        .tabela-saidas .numero {

            text-align: center;

        }


        .tabela-saidas .valor {

            text-align: right;

            white-space: nowrap;

        }


        .produto-sem-venda {

            color: #999;

        }


        .linha-total {

            font-weight: bold;

            background: #f5f5f5;

        }


        .mensagem-saidas {

            text-align: center;

            padding: 30px;

            color: #666;

        }


        /* =========================================
           BOTÕES DE AJUSTE
        ========================================= */

        .controles-produto {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            white-space: nowrap;

        }


        .btn-ajuste {

            width: 32px;

            height: 32px;

            border: none;

            border-radius: 6px;

            background: #245d88;

            color: white;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            line-height: 1;

        }


        .btn-ajuste:hover {

            opacity: 0.85;

        }


        .btn-excluir {

            margin-left: 2px;

            padding: 7px 10px;

            border: none;

            border-radius: 6px;

            background: #b3261e;

            color: white;

            cursor: pointer;

            font-size: 12px;

        }


        .btn-excluir:hover {

            opacity: 0.85;

        }


        /* =========================================
           BOTÃO VOLTAR
        ========================================= */

        .btn-voltar-saidas {

            display: block;

            width: fit-content;

            margin: 25px auto;

            padding: 12px 20px;

            border: none;

            border-radius: 8px;

            background: #555;

            color: white;

            text-decoration: none;

            cursor: pointer;

            font-size: 15px;

        }


        /* =========================================
           CELULAR
        ========================================= */

        @media (max-width: 600px) {

            .tabela-saidas {

                font-size: 13px;

            }


            .tabela-saidas th,
            .tabela-saidas td {

                padding: 9px 8px;

            }


            .resumo-saidas strong {

                font-size: 19px;

            }


            .controles-produto {

                gap: 4px;

            }


            .btn-ajuste {

                width: 30px;

                height: 30px;

            }


            .btn-excluir {

                padding: 6px 8px;

            }

        }

    </style>

</head>


<body class="saidas-page">

<a

<header class="topo">

</header>


<main>


    <!-- =========================================
         FILTROS
    ========================================= -->

    <section class="filtro-saidas">

        <label for="mesSelecionado">

        <select id="mesSelecionado">

    ========================================= -->

    <section class="resumo-saidas">

        <div>

            <span>

            <strong id="quantidadeProdutos">

            </strong>

            </strong>

            <span>

            </span>

<!-- =========================================
     FIREBASE
========================================= -->

<script
    type="module"
    src="js/firebase.js?v=3"
></script>


<script>

    /* =========================================
       AGUARDAR FIREBASE
    ========================================= */

    async function aguardarFirebase() {

        let tentativas = 0;

        while (
            !window.firebaseHotel &&
            tentativas < 50
        ) {

            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        100
                    )
            );

            tentativas++;

        }

        return !!window.firebaseHotel;

    }


    /* =========================================
       ELEMENTOS
    ========================================= */

    const seletorMes =
        document.getElementById(
            "mesSelecionado"
        );


    const buscarProduto =
        document.getElementById(
            "buscarProduto"
        );


    const corpoTabela =
        document.getElementById(
            "corpoTabela"
        );


    const quantidadeProdutos =
        document.getElementById(
            "quantidadeProdutos"
        );


    const quantidadeUnidades =
        document.getElementById(
            "quantidadeUnidades"
        );


    const totalVendido =
        document.getElementById(
            "totalVendido"
        );


    let saidasFirebase = [];


    let produtos = [];


    /* =========================================
       FORMATAR MOEDA
    ========================================= */

    function formatarMoeda(valor) {

        return (

            "R$ " +

            Number(valor || 0)
                .toFixed(2)
                .replace(".", ",")

        );

    }


    /* =========================================
       CRIAR MESES
    ========================================= */

    function criarMeses() {

        const agora =
            new Date();


        seletorMes.innerHTML =
            "";


        /*
            Mês atual + próximos 12 meses.
        */

        for (
            let i = 0;
            i < 13;
            i++
        ) {

            const data =
                new Date(
                    agora.getFullYear(),
                    agora.getMonth() + i,
                    1
                );


            const ano =
                data.getFullYear();


            const mes =
                String(
                    data.getMonth() + 1
                ).padStart(
                    2,
                    "0"
                );


            const valor =
                `${ano}-${mes}`;


            const texto =
                data.toLocaleDateString(
                    "pt-BR",
                    {
                        month:
                            "long",

                        year:
                            "numeric"
                    }
                );


            const option =
                document.createElement(
                    "option"
                );


            option.value =
                valor;


            option.textContent =
                texto.charAt(0).toUpperCase() +
                texto.slice(1);


            seletorMes.appendChild(
                option
            );

        }

    }


    /* =========================================
       CARREGAR PRODUTOS DO FIRESTORE
    ========================================= */

    async function carregarProdutos() {

        const conectado =
            await aguardarFirebase();


        if (!conectado) {

            return;

        }


        try {

            const {
                db,
                collection,
                getDocs
            } = window.firebaseHotel;


            const referencia =
                collection(
                    db,
                    "produtos"
                );


            const snapshot =
                await getDocs(
                    referencia
                );


            produtos = [];


            snapshot.forEach(
                documento => {

                    const dados =
                        documento.data();


                    produtos.push({

                        id:
                            documento.id,

                        nome:
                            dados.nome || "",

                        categoria:
                            dados.categoria || "",

                        preco:
                            Number(
                                dados.preco || 0
                            )

                    });

                }
            );


            produtos.sort(
                (a, b) =>
                    a.nome.localeCompare(
                        b.nome,
                        "pt-BR"
                    )
            );

        }
        catch (erro) {

            console.error(
                "Erro ao carregar produtos:",
                erro
            );

        }

    }


    /* =========================================
       ENCONTRAR PRODUTO
    ========================================= */

    function encontrarProduto(item) {

        const idItem =
            String(
                item.id ?? ""
            );


        /*
            Primeiro tenta pelo ID atual
            do documento do Firestore.
        */

        let produto =
            produtos.find(
                produto =>
                    String(
                        produto.id
                    ) ===
                    idItem
            );


        if (produto) {

            return produto;

        }


        /*
            Compatibilidade com vendas antigas:
            procura pelo nome.
        */

        const nomeItem =
            String(
                item.nome || ""
            )
                .trim()
                .toLowerCase();


        if (!nomeItem) {

            return null;

        }


        produto =
            produtos.find(
                produto =>
                    String(
                        produto.nome || ""
                    )
                        .trim()
                        .toLowerCase() ===
                    nomeItem
            );


        return produto || null;

    }


    /* =========================================
       CARREGAR SAÍDAS
    ========================================= */

    async function carregarSaidas() {

        const conectado =
            await aguardarFirebase();


        if (!conectado) {

            corpoTabela.innerHTML = `

                <tr>

                    <td
                        colspan="6"
                        class="mensagem-saidas"
                    >
                        Não foi possível
                        conectar ao Firebase.
                    </td>

                </tr>

            `;

            return;

        }


        try {

            const {
                db,
                collection,
                getDocs
            } = window.firebaseHotel;


            const referencia =
                collection(
                    db,
                    "saidas"
                );


            const snapshot =
                await getDocs(
                    referencia
                );


            saidasFirebase = [];


            snapshot.forEach(
                documento => {

                    saidasFirebase.push({

                        id:
                            documento.id,

                        ...documento.data()

                    });

                }
            );


            mostrarSaidas();

        }
        catch (erro) {

            console.error(
                "Erro ao carregar saídas:",
                erro
            );


            corpoTabela.innerHTML = `

                <tr>

                    <td
                        colspan="6"
                        class="mensagem-saidas"
                    >
                        Erro ao carregar
                        as vendas.
                    </td>

                </tr>

            `;

        }

    }


    /* =========================================
       MOSTRAR SAÍDAS
    ========================================= */

    function mostrarSaidas() {

        const mes =
            seletorMes.value;


        const busca =
            buscarProduto.value
                .trim()
                .toLowerCase();


        /*
            Soma os produtos somente
            do mês selecionado.
        */

        const vendasPorProduto = {};


        saidasFirebase.forEach(
            saida => {

                if (
                    saida.referenciaMes !==
                    mes
                ) {

                    return;

                }


                const itens =
                    Array.isArray(
                        saida.itens
                    )
                        ? saida.itens
                        : [];


                itens.forEach(
                    item => {

                        const produto =
                            encontrarProduto(
                                item
                            );


                        if (!produto) {

                            return;

                        }


                        const id =
                            String(
                                produto.id
                            );


                        if (
                            !vendasPorProduto[id]
                        ) {

                            vendasPorProduto[id] = {

                                quantidade:
                                    0,

                                total:
                                    0,

                                valorUnitario:
                                    Number(
                                        item.valorUnitario ??
                                        produto.preco ??
                                        0
                                    )

                            };

                        }


                        vendasPorProduto[id]
                            .quantidade +=
                            Number(
                                item.quantidade || 0
                            );


                        vendasPorProduto[id]
                            .total +=
                            Number(
                                item.total || 0
                            );

                    }
                );

            }
        );


        corpoTabela.innerHTML =
            "";


        let produtosVendidos =
            0;


        let unidadesVendidas =
            0;


        let totalGeral =
            0;


        /*
            Mostra todos os produtos
            cadastrados no Firestore.
        */

        produtos.forEach(
            produto => {

                /*
                    Pesquisa pelo nome.
                */

                if (
                    busca &&
                    !String(
                        produto.nome || ""
                    )
                        .toLowerCase()
                        .includes(
                            busca
                        )
                ) {

                    return;

                }


                const id =
                    String(
                        produto.id
                    );


                const venda =
                    vendasPorProduto[id];


                const quantidade =
                    venda
                        ? venda.quantidade
                        : 0;


                const total =
                    venda
                        ? venda.total
                        : 0;


                const valorUnitario =
                    venda
                        ? venda.valorUnitario
                        : Number(
                            produto.preco || 0
                        );


                if (
                    quantidade > 0
                ) {

                    produtosVendidos++;

                }


                unidadesVendidas +=
                    quantidade;


                totalGeral +=
                    total;


                const tr =
                    document.createElement(
                        "tr"
                    );


                if (
                    quantidade === 0
                ) {

                    tr.className =
                        "produto-sem-venda";

                }


                tr.innerHTML = `

                    <td>
                        ${produto.nome}
                    </td>

                    <td>
                        ${produto.categoria || ""}
                    </td>

                    <td class="valor">
                        ${formatarMoeda(
                            valorUnitario
                        )}
                    </td>

                    <td class="numero">
                        ${quantidade}
                    </td>

                    <td>

                        <div class="controles-produto">

                            <button
                                class="btn-ajuste"
                                onclick="alterarQuantidadeProduto('${produto.id}', -1)"
                                title="Diminuir 1"
                            >
                                −
                            </button>

                            <button
                                class="btn-ajuste"
                                onclick="alterarQuantidadeProduto('${produto.id}', 1)"
                                title="Aumentar 1"
                            >
                                +
                            </button>

                            <button
                                class="btn-excluir"
                                onclick="excluirProdutoMes('${produto.id}')"
                                title="Excluir produto deste mês"
                            >
                                Excluir
                            </button>

                        </div>

                    </td>

                    <td class="valor">
                        ${formatarMoeda(
                            total
                        )}
                    </td>

                `;


                corpoTabela.appendChild(
                    tr
                );

            }
        );


        /*
            Nenhum produto encontrado.
        */

        if (
            corpoTabela.children.length === 0
        ) {

            corpoTabela.innerHTML = `

                <tr>

                    <td
                        colspan="6"
                        class="mensagem-saidas"
                    >
                        Nenhum produto encontrado.
                    </td>

                </tr>

            `;

        }


        /*
            Total do mês.
        */

        const trTotal =
            document.createElement(
                "tr"
            );


        trTotal.className =
            "linha-total";


        trTotal.innerHTML = `

            <td colspan="3">
                TOTAL DO MÊS
            </td>

            <td class="numero">
                ${unidadesVendidas}
            </td>

            <td></td>

            <td class="valor">
                ${formatarMoeda(
                    totalGeral
                )}
            </td>

        `;


        corpoTabela.appendChild(
            trTotal
        );


        quantidadeProdutos.textContent =
            produtosVendidos;


        quantidadeUnidades.textContent =
            unidadesVendidas;


        totalVendido.textContent =
            formatarMoeda(
                totalGeral
            );

    }


    /* =========================================
       ALTERAR QUANTIDADE
       SOMENTE NO MÊS SELECIONADO
    ========================================= */

    async function alterarQuantidadeProduto(
        idProduto,
        variacao
    ) {

        const mes =
            seletorMes.value;


        /*
            Busca registros do mês
            atualmente selecionado.

            Aceita tanto o ID atual
            quanto o nome do produto.
        */

        const produto =
            produtos.find(
                item =>
                    String(
                        item.id
                    ) ===
                    String(
                        idProduto
                    )
            );


        if (!produto) {

            return;

        }


        const registros =
            saidasFirebase.filter(
                saida =>
                    saida.referenciaMes ===
                    mes &&
                    Array.isArray(
                        saida.itens
                    ) &&
                    saida.itens.some(
                        item => {

                            const encontrado =
                                encontrarProduto(
                                    item
                                );

                            return (
                                encontrado &&
                                String(
                                    encontrado.id
                                ) ===
                                String(
                                    idProduto
                                )
                            );

                        }
                    )
            );


        if (
            registros.length === 0
        ) {

            alert(
                "Esse produto não possui venda registrada neste mês."
            );

            return;

        }


        /*
            + 1
            Adiciona somente no último
            fechamento desse mês.
        */

        if (
            variacao > 0
        ) {

            const registro =
                registros[
                    registros.length - 1
                ];


            const itens =
                [...registro.itens];


            const indice =
                itens.findIndex(
                    item => {

                        const encontrado =
                            encontrarProduto(
                                item
                            );

                        return (
                            encontrado &&
                            String(
                                encontrado.id
                            ) ===
                            String(
                                idProduto
                            )
                        );

                    }
                );


            if (
                indice === -1
            ) {

                return;

            }


            const item =
                {
                    ...itens[indice]
                };


            const quantidadeAtual =
                Number(
                    item.quantidade || 0
                );


            const novaQuantidade =
                quantidadeAtual + 1;


            item.quantidade =
                novaQuantidade;


            item.total =
                Number(
                    (
                        Number(
                            item.valorUnitario || 0
                        ) *
                        novaQuantidade
                    ).toFixed(2)
                );


            itens[indice] =
                item;


            await atualizarRegistroSaida(
                registro.id,
                itens
            );


            registro.itens =
                itens;

        }


        /*
            - 1
            Retira somente do mês selecionado,
            começando pelo último fechamento.
        */

        if (
            variacao < 0
        ) {

            let restante =
                1;


            for (
                let i = registros.length - 1;
                i >= 0 &&
                restante > 0;
                i--
            ) {

                const registro =
                    registros[i];


                const itens =
                    [...registro.itens];


                const indice =
                    itens.findIndex(
                        item => {

                            const encontrado =
                                encontrarProduto(
                                    item
                                );

                            return (
                                encontrado &&
                                String(
                                    encontrado.id
                                ) ===
                                String(
                                    idProduto
                                )
                            );

                        }
                    );


                if (
                    indice === -1
                ) {

                    continue;

                }


                const item =
                    {
                        ...itens[indice]
                    };


                const quantidadeAtual =
                    Number(
                        item.quantidade || 0
                    );


                if (
                    quantidadeAtual <= 0
                ) {

                    continue;

                }


                const novaQuantidade =
                    quantidadeAtual - 1;


                if (
                    novaQuantidade === 0
                ) {

                    itens.splice(
                        indice,
                        1
                    );

                }
                else {

                    item.quantidade =
                        novaQuantidade;


                    item.total =
                        Number(
                            (
                                Number(
                                    item.valorUnitario || 0
                                ) *
                                novaQuantidade
                            ).toFixed(2)
                        );


                    itens[indice] =
                        item;

                }


                await atualizarRegistroSaida(
                    registro.id,
                    itens
                );


                registro.itens =
                    itens;


                restante--;

            }

        }


        mostrarSaidas();

    }


    /* =========================================
       ATUALIZAR SAÍDA NO FIREBASE
    ========================================= */

    async function atualizarRegistroSaida(
        idRegistro,
        itens
    ) {

        const {
            db,
            doc,
            updateDoc
        } = window.firebaseHotel;


        await updateDoc(
            doc(
                db,
                "saidas",
                idRegistro
            ),
            {
                itens:
                    itens
            }
        );

    }


    /* =========================================
       EXCLUIR PRODUTO DO MÊS
    ========================================= */

    async function excluirProdutoMes(
        idProduto
    ) {

        const mes =
            seletorMes.value;


        const produto =
            produtos.find(
                item =>
                    String(
                        item.id
                    ) ===
                    String(
                        idProduto
                    )
            );


        if (!produto) {

            return;

        }


        const confirmar =
            confirm(
                `Excluir todas as vendas de "${produto.nome}" deste mês?\n\nEssa ação não poderá ser desfeita.`
            );


        if (!confirmar) {

            return;

        }


        try {

            const {
                db,
                doc,
                updateDoc
            } = window.firebaseHotel;


            /*
                Procura somente os registros
                do mês selecionado.
            */

            const registros =
                saidasFirebase.filter(
                    saida =>
                        saida.referenciaMes ===
                        mes &&
                        Array.isArray(
                            saida.itens
                        ) &&
                        saida.itens.some(
                            item => {

                                const encontrado =
                                    encontrarProduto(
                                        item
                                    );

                                return (
                                    encontrado &&
                                    String(
                                        encontrado.id
                                    ) ===
                                    String(
                                        idProduto
                                    )
                                );

                            }
                        )
                );


            /*
                Remove o produto somente
                desses registros.
            */

            for (
                const registro
                of registros
            ) {

                const novosItens =
                    registro.itens.filter(
                        item => {

                            const encontrado =
                                encontrarProduto(
                                    item
                                );

                            return !(
                                encontrado &&
                                String(
                                    encontrado.id
                                ) ===
                                String(
                                    idProduto
                                )
                            );

                        }
                    );


                await updateDoc(
                    doc(
                        db,
                        "saidas",
                        registro.id
                    ),
                    {
                        itens:
                            novosItens
                    }
                );


                registro.itens =
                    novosItens;

            }


            mostrarSaidas();

        }
        catch (erro) {

            console.error(
                "Erro ao excluir produto:",
                erro
            );


            alert(
                "Não foi possível excluir o produto."
            );

        }

    }


    /* =========================================
       EVENTOS
    ========================================= */

    seletorMes.addEventListener(
        "change",
        mostrarSaidas
    );


    buscarProduto.addEventListener(
        "input",
        mostrarSaidas
    );


    /* =========================================
       INICIAR
    ========================================= */

    criarMeses();


    (async function iniciarRelatorio() {

        await carregarProdutos();

        await carregarSaidas();

    })();

</script>
