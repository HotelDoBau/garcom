<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Consultar vendas - Hotel do Baú</title>

<link
    rel="stylesheet"
    href="css/style.css"
>

<style>

    /* =========================================
       PÁGINA
    ========================================= */

    .saidas-page {
        padding-bottom: 40px;
        background: #f4f6f8;
    }


    /* =========================================
       CABEÇALHO
    ========================================= */

    .cabecalho-vendas {
        text-align: center;
        padding: 20px 15px 10px;
    }

    .cabecalho-vendas h2 {
        margin: 0;
        color: #17212b;
        font-size: 24px;
    }

    .cabecalho-vendas p {
        margin: 6px 0 0;
        color: #6b737a;
        font-size: 14px;
    }


    /* =========================================
       FILTRO
    ========================================= */

    .filtro-saidas {
        margin: 20px auto;
        padding: 20px;
        width: calc(100% - 30px);
        max-width: 700px;
        box-sizing: border-box;
        background: white;
        border-radius: 14px;
        box-shadow:
            0 3px 12px
            rgba(0,0,0,0.08);
    }


    .filtro-saidas label {
        display: block;
        margin-bottom: 8px;
        color: #333;
        font-weight: 600;
    }


    .filtro-saidas select {
        width: 100%;
        padding: 13px;
        border-radius: 9px;
        border: 1px solid #ccc;
        background: white;
        font-size: 16px;
        box-sizing: border-box;
        outline: none;
    }


    .filtro-saidas select:focus {
        border-color: #245d88;
    }


  
/* =========================================
   RESUMO
========================================= */

.resumo-saidas {
    width: calc(100% - 30px);
    max-width: 700px;
    margin: 20px auto;
    padding: 18px 20px;
    box-sizing: border-box;

    background: #ffffff;
    border: 1px solid #258bff;
    border-radius: 14px;

    box-shadow:
        0 0 5px rgba(37, 139, 255, 0.30),
        0 0 12px rgba(37, 139, 255, 0.12),
        0 3px 12px rgba(0, 0, 0, 0.06);

    display: flex;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
}

.resumo-item {
    flex: 1;
    min-width: 130px;
}

.resumo-item span {
    display: block;
    margin-bottom: 6px;
    color: #526171;
    font-size: 13px;
    font-weight: 600;
}

.resumo-item strong {
    display: block;
    color: #15569a;
    font-size: 23px;
    font-weight: 800;
}


    /* =========================================
       LISTA DE FECHAMENTOS
    ========================================= */

  .lista-vendas {
    width: calc(100% - 30px);
    max-width: 700px;
    margin: 20px auto;
}


.venda-card {
    margin-bottom: 14px;
    padding: 18px;
    background: #ffffff;
    border: 1px solid #258bff;
    border-radius: 14px;

    box-shadow:
        0 0 5px rgba(37, 139, 255, 0.35),
        0 0 12px rgba(37, 139, 255, 0.12),
        0 3px 12px rgba(0, 0, 0, 0.07);

    box-sizing: border-box;

    transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
}

.venda-card:hover {
    border-color: #006eff;

    box-shadow:
        0 0 7px rgba(0, 110, 255, 0.55),
        0 0 16px rgba(0, 110, 255, 0.20),
        0 4px 14px rgba(0, 0, 0, 0.10);
}


.venda-data {
    margin-bottom: 12px;
    color: #6b737a;
    font-size: 13px;
}


.venda-local {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 12px;
}


.venda-local strong {
    color: #15569a;
    font-size: 18px;
    font-weight: 800;
}


.venda-total {
    color: #15569a;
    font-size: 20px;
    font-weight: 800;
    white-space: nowrap;
}


.venda-linha {
    border-top: 1px solid #edf0f2;
    padding-top: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}


.venda-info {
    color: #737b82;
    font-size: 13px;
}


    /* =========================================
       BOTÕES DA VENDA
    ========================================= */

    .venda-botoes {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
    }


    .btn-ver-comanda,
    .btn-excluir-venda {
        border: none;
        border-radius: 8px;
        padding: 10px 14px;
        color: white;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
    }


    .btn-ver-comanda {
        background: #245d88;
    }


    .btn-excluir-venda {
        background: #b42318;
    }


    .btn-ver-comanda:hover,
    .btn-excluir-venda:hover {
        opacity: 0.88;
    }


    /* =========================================
       MENSAGEM
    ========================================= */

    .mensagem-saidas {
        padding: 35px 20px;
        text-align: center;
        color: #6d757b;
        background: white;
        border-radius: 14px;
        box-shadow:
            0 3px 12px
            rgba(0,0,0,0.06);
    }


    /* =========================================
       MODAL DA COMANDA
    ========================================= */

    .modal-comanda {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 15px;
        box-sizing: border-box;
        background:
            rgba(0,0,0,0.55);
    }


    .modal-comanda.mostrar {
        display: flex;
    }


    .comanda-conteudo {
        width: 100%;
        max-width: 500px;
        max-height: 90vh;
        overflow-y: auto;
        padding: 22px;
        box-sizing: border-box;
        background: white;
        border-radius: 16px;
        box-shadow:
            0 10px 35px
            rgba(0,0,0,0.25);
    }


    .comanda-cabecalho {
        text-align: center;
        margin-bottom: 18px;
    }


    .comanda-cabecalho h2 {
        margin: 0;
        color: #17212b;
        font-size: 21px;
    }


    .comanda-cabecalho p {
        margin: 5px 0 0;
        color: #727a80;
        font-size: 13px;
    }


    .comanda-local {
        margin-bottom: 18px;
        padding: 13px;
        border-radius: 9px;
        background: #f1f4f6;
        color: #17212b;
        font-weight: 600;
        text-align: center;
    }


    .item-comanda {
        padding: 12px 0;
        border-bottom:
            1px solid #eceff1;
    }


    .item-comanda:last-child {
        border-bottom: none;
    }


    .item-comanda-principal {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        color: #27313a;
        font-size: 14px;
    }


    .item-comanda-nome {
        flex: 1;
    }


    .item-comanda-total {
        font-weight: 600;
        white-space: nowrap;
    }


    .item-comanda-detalhe {
        margin-top: 4px;
        color: #7a8288;
        font-size: 12px;
    }


    .totais-comanda {
        margin-top: 15px;
        padding-top: 15px;
        border-top:
            1px solid #dfe3e6;
    }


    .linha-total-comanda {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        margin: 7px 0;
        color: #555;
        font-size: 14px;
    }


    .linha-total-comanda.final {
        margin-top: 12px;
        padding-top: 12px;
        border-top:
            1px dashed #cfd4d8;
        color: #17212b;
        font-size: 19px;
        font-weight: bold;
    }


    .comanda-data {
        margin-top: 18px;
        text-align: center;
        color: #7a8288;
        font-size: 12px;
    }


    .btn-fechar-comanda {
        width: 100%;
        margin-top: 20px;
        padding: 13px;
        border: none;
        border-radius: 9px;
        background: #555;
        color: white;
        font-size: 15px;
        cursor: pointer;
    }


    .btn-fechar-comanda:hover {
        opacity: 0.88;
    }


    /* =========================================
       VOLTAR
    ========================================= */

    .btn-voltar-saidas {
        display: block;
        width: fit-content;
        margin: 25px auto;
        padding: 12px 20px;
        border: none;
        border-radius: 8px;
        background: #555;
        color: white;
        text-decoration: none;
        cursor: pointer;
        font-size: 15px;
    }


    /* =========================================
       RESPONSIVO
    ========================================= */

    @media (max-width: 600px) {

        .venda-local strong {
            font-size: 16px;
        }


        .venda-total {
            font-size: 16px;
        }


        .venda-linha {
            align-items: flex-start;
        }


        .venda-botoes {
            width: 100%;
            justify-content: flex-end;
        }


        .btn-ver-comanda,
        .btn-excluir-venda {
            padding: 9px 11px;
        }

    }

</style>

<body class="saidas-page">

<header class="topo">

<h1>
    Consultar vendas
</h1>

<p>
    Fechamentos realizados
</p>

</header>

<main>

<button
    class="btn-voltar-saidas"
    onclick="window.location.href='index.html'"
>

    ← Voltar

</button>


<!-- =========================================
     TÍTULO
========================================= -->

<section class="cabecalho-vendas">

    <h2>
        Vendas do período
    </h2>

    <p>
        Consulte cada fechamento realizado no mês selecionado.
    </p>

</section>


<!-- =========================================
     FILTRO
========================================= -->

<section class="filtro-saidas">

    <label for="mesSelecionado">
        Mês
    </label>

    <select id="mesSelecionado">

        <option value="">
            Carregando...
        </option>

    </select>

</section>


<!-- =========================================
     RESUMO
========================================= -->

<section class="resumo-saidas">

    <div class="resumo-item">

        <span>

        </span>

        </strong>

        </strong>

</section>

     LISTA
========================================= -->

<section

>

</section>

>

        id="conteudoComanda"

    </button>

</div>


</div>

<script
    type="module"
    src="js/firebase.js?v=3"
></script>

<script>


/* =========================================
   AGUARDAR FIREBASE
========================================= */

async function aguardarFirebase() {

    let tentativas = 0;


    while (
        !window.firebaseHotel &&
        tentativas < 50
    ) {

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    100
                )
        );

        tentativas++;

    }


    return !!window.firebaseHotel;

}


/* =========================================
   ELEMENTOS
========================================= */

const seletorMes =
    document.getElementById(
        "mesSelecionado"
    );

const listaVendas =
    document.getElementById(
        "listaVendas"
    );

const quantidadeFechamentos =
    document.getElementById(
        "quantidadeFechamentos"
    );

const totalVendido =
    document.getElementById(
        "totalVendido"
    );

const modalComanda =
    document.getElementById(
        "modalComanda"
    );

const conteudoComanda =
    document.getElementById(
        "conteudoComanda"
    );


let saidasFirebase = [];


/* =========================================
   FORMATAR MOEDA
========================================= */

function formatarMoeda(valor) {

    return (
        "R$ " +
        Number(valor || 0)
            .toFixed(2)
            .replace(".", ",")
    );

}


/* =========================================
   OBTER TOTAL DA VENDA
========================================= */

function obterTotalVenda(venda) {

    /*
        Se o total já estiver salvo,
        usa o valor gravado.
    */

    if (
        venda.total !== undefined &&
        venda.total !== null
    ) {

        return Number(
            venda.total
        );

    }


    /*
        Caso não exista total salvo,
        calcula através dos itens.
    */

    const itens =
        Array.isArray(
            venda.itens
        )
            ? venda.itens
            : [];


    return itens.reduce(
        (
            soma,
            item
        ) => {

            const quantidade =
                Number(
                    item.quantidade || 0
                );


            const valorUnitario =
                Number(
                    item.valorUnitario ??
                    item.preco ??
                    0
                );


            const totalItem =
                Number(
                    item.total ??
                    (
                        valorUnitario *
                        quantidade
                    )
                );


            return (
                soma +
                totalItem
            );

        },
        0
    );

}


/* =========================================
   CRIAR MESES
========================================= */

function criarMeses() {

    const agora =
        new Date();


    seletorMes.innerHTML =
        "";


    for (
        let i = -12;
        i <= 12;
        i++
    ) {

        const data =
            new Date(
                agora.getFullYear(),
                agora.getMonth() + i,
                1
            );


        const ano =
            data.getFullYear();


        const mes =
            String(
                data.getMonth() + 1
            ).padStart(
                2,
                "0"
            );


        const valor =
            `${ano}-${mes}`;


        const texto =
            data.toLocaleDateString(
                "pt-BR",
                {
                    month:
                        "long",
                    year:
                        "numeric"
                }
            );


        const option =
            document.createElement(
                "option"
            );


        option.value =
            valor;


        option.textContent =
            texto.charAt(0).toUpperCase() +
            texto.slice(1);


        seletorMes.appendChild(
            option
        );

    }


    const mesAtual =
        `${agora.getFullYear()}-` +
        `${String(
            agora.getMonth() + 1
        ).padStart(
            2,
            "0"
        )}`;


    seletorMes.value =
        mesAtual;

}


/* =========================================
   CARREGAR VENDAS
========================================= */

async function carregarSaidas() {

    const conectado =
        await aguardarFirebase();


    if (!conectado) {

        listaVendas.innerHTML = `

            <div class="mensagem-saidas">

                Não foi possível conectar
                ao Firebase.

            </div>

        `;

        return;

    }


    try {

        const {
            db,
            collection,
            getDocs
        } = window.firebaseHotel;


        const referencia =
            collection(
                db,
                "saidas"
            );


        const snapshot =
            await getDocs(
                referencia
            );


        saidasFirebase = [];


        snapshot.forEach(
            documento => {

                saidasFirebase.push({

                    id:
                        documento.id,

                    ...documento.data()

                });

            }
        );


        mostrarVendas();

    }
    catch (erro) {

        console.error(
            "Erro ao carregar vendas:",
            erro
        );


        listaVendas.innerHTML = `

            <div class="mensagem-saidas">

                Erro ao carregar
                as vendas.

            </div>

        `;

    }

}


/* =========================================
   EXCLUIR VENDA
========================================= */

async function excluirVenda(idVenda) {

    const venda =
        saidasFirebase.find(
            item =>
                item.id === idVenda
        );


    if (!venda) {

        alert(
            "Não foi possível localizar esta venda."
        );

        return;

    }


    const confirmar =
        confirm(
            "Tem certeza que deseja excluir esta venda?\n\n" +
            "Esta ação não poderá ser desfeita."
        );


    if (!confirmar) {

        return;

    }


    const conectado =
        await aguardarFirebase();


    if (!conectado) {

        alert(
            "Não foi possível conectar ao Firebase."
        );

        return;

    }


    try {

        const {
            db,
            doc,
            deleteDoc
        } = window.firebaseHotel;


        if (
            typeof doc !== "function" ||
            typeof deleteDoc !== "function"
        ) {

            alert(
                "A função de exclusão não está disponível no Firebase."
            );

            console.error(
                "doc ou deleteDoc não encontrados em window.firebaseHotel."
            );

            return;

        }


        await deleteDoc(
            doc(
                db,
                "saidas",
                idVenda
            )
        );


        /*
            Remove imediatamente da memória
            para atualizar a tela.
        */

        saidasFirebase =
            saidasFirebase.filter(
                venda =>
                    venda.id !== idVenda
            );


        mostrarVendas();


        alert(
            "Venda excluída com sucesso."
        );

    }
    catch (erro) {

        console.error(
            "Erro ao excluir venda:",
            erro
        );


        alert(
            "Não foi possível excluir esta venda."
        );

    }

}


/* =========================================
   OBTER DATA DO FECHAMENTO
========================================= */

function obterDataVenda(venda) {

    if (venda.dataHora) {

        return String(
            venda.dataHora
        );

    }


    if (
        venda.criadoEm &&
        venda.criadoEm.seconds
    ) {

        const data =
            new Date(
                venda.criadoEm.seconds *
                1000
            );


        return data.toLocaleString(
            "pt-BR"
        );

    }


    return "Data não informada";

}


/* =========================================
   ORDENAR VENDAS
========================================= */

function obterTimestampVenda(venda) {

    if (
        venda.criadoEm &&
        venda.criadoEm.seconds
    ) {

        return Number(
            venda.criadoEm.seconds
        );

    }


    /*
        Fallback para registros
        antigos que só tenham dataHora.
    */

    if (venda.dataHora) {

        const partes =
            String(
                venda.dataHora
            ).match(
                /(\d{2})\/(\d{2})\/(\d{4}).*?(\d{2}):(\d{2})/
            );


        if (partes) {

            return new Date(
                Number(
                    partes[3]
                ),
                Number(
                    partes[2]
                ) - 1,
                Number(
                    partes[1]
                ),
                Number(
                    partes[4]
                ),
                Number(
                    partes[5]
                )
            ).getTime() / 1000;

        }

    }


    return 0;

}


/* =========================================
   IDENTIFICAÇÃO DO LOCAL
========================================= */

function obterLocalVenda(venda) {

    const tipo =
        venda.tipo === "quarto"
            ? "QUARTO"
            : "MESA";


    const numero =
        Number(
            venda.numero ||
            venda.quarto ||
            venda.mesa ||
            0
        );


    return (
        tipo +
        " " +
        String(
            numero
        ).padStart(
            2,
            "0"
        )
    );

}


/* =========================================
   MOSTRAR VENDAS
========================================= */

function mostrarVendas() {

    const mes =
        seletorMes.value;


    const vendas =
        saidasFirebase
            .filter(
                venda =>
                    String(
                        venda.referenciaMes ||
                        ""
                    ) === mes
            )
            .sort(
                (
                    a,
                    b
                ) =>
                    obterTimestampVenda(b) -
                    obterTimestampVenda(a)
            );


    listaVendas.innerHTML =
        "";


    let total =
        0;


    vendas.forEach(
        venda => {

            const totalVenda =
                obterTotalVenda(
                    venda
                );


            total +=
                totalVenda;


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "venda-card";


            card.innerHTML = `

                <div class="venda-data">

                    ${obterDataVenda(venda)}

                </div>


                <div class="venda-local">

                    <strong>

                        ${obterLocalVenda(venda)}

                    </strong>


                    <span class="venda-total">

                        ${formatarMoeda(
                            totalVenda
                        )}

                    </span>

                </div>


                <div class="venda-linha">

                    <span class="venda-info">

                        Fechamento realizado

                    </span>


                    <div class="venda-botoes">

                        <button
                            class="btn-ver-comanda"
                            onclick="verComanda('${venda.id}')"
                        >

                            Ver comanda

                        </button>


                        <button
                            class="btn-excluir-venda"
                            onclick="excluirVenda('${venda.id}')"
                        >

                            Excluir

                        </button>

                    </div>

                </div>

            `;


            listaVendas.appendChild(
                card
            );

        }
    );


    if (
        vendas.length === 0
    ) {

        listaVendas.innerHTML = `

            <div class="mensagem-saidas">

                Nenhum fechamento encontrado
                para este mês.

            </div>

        `;

    }


    quantidadeFechamentos.textContent =
        vendas.length;


    totalVendido.textContent =
        formatarMoeda(
            total
        );

}


/* =========================================
   VER COMANDA
========================================= */

function verComanda(idVenda) {

    const venda =
        saidasFirebase.find(
            item =>
                item.id === idVenda
        );


    if (!venda) {

        alert(
            "Não foi possível localizar esta venda."
        );

        return;

    }


    const itens =
        Array.isArray(
            venda.itens
        )
            ? venda.itens
            : [];


    let html = `

        <div class="comanda-cabecalho">

            <h2>
                HOTEL DO BAÚ
            </h2>

            <p>
                Consulta de comanda
            </p>

        </div>


        <div class="comanda-local">

            ${obterLocalVenda(venda)}

        </div>

    `;


    if (
        itens.length === 0
    ) {

        html += `

            <div class="mensagem-saidas">

                Nenhum item registrado
                nesta comanda.

            </div>

        `;

    }
    else {

        itens.forEach(
            item => {

                const quantidade =
                    Number(
                        item.quantidade || 0
                    );


                const valorUnitario =
                    Number(
                        item.valorUnitario ??
                        item.preco ??
                        0
                    );


                const totalItem =
                    Number(
                        item.total ??
                        (
                            valorUnitario *
                            quantidade
                        )
                    );


                html += `

                    <div class="item-comanda">

                        <div
                            class="item-comanda-principal"
                        >

                            <span
                                class="item-comanda-nome"
                            >

                                ${quantidade}x
                                ${item.nome || "Produto"}

                            </span>


                            <span
                                class="item-comanda-total"
                            >

                                ${formatarMoeda(
                                    totalItem
                                )}

                            </span>

                        </div>


                        <div
                            class="item-comanda-detalhe"
                        >

                            ${formatarMoeda(
                                valorUnitario
                            )}

                            por unidade

                        </div>

                    </div>

                `;

            }
        );

    }


    const subtotal =
        Number(
            venda.subtotal || 0
        );


    const desconto =
        Number(
            venda.desconto || 0
        );


    const total =
        obterTotalVenda(
            venda
        );


    html += `

        <div class="totais-comanda">

            <div class="linha-total-comanda">

                <span>
                    Subtotal
                </span>


                <strong>
                    ${formatarMoeda(
                        subtotal
                    )}
                </strong>

            </div>


            <div class="linha-total-comanda">

                <span>
                    Desconto
                </span>


                <strong>
                    ${formatarMoeda(
                        desconto
                    )}
                </strong>

            </div>


            <div
                class="
                    linha-total-comanda
                    final
                "
            >

                <span>
                    Total
                </span>


                <strong>
                    ${formatarMoeda(
                        total
                    )}
                </strong>

            </div>

        </div>


        <div class="comanda-data">

            ${obterDataVenda(venda)}

        </div>

    `;


    conteudoComanda.innerHTML =
        html;


    modalComanda.classList.add(
        "mostrar"
    );

}


/* =========================================
   FECHAR COMANDA
========================================= */

function fecharComanda() {

    modalComanda.classList.remove(
        "mostrar"
    );

}


/* =========================================
   FECHAR CLICANDO FORA
========================================= */

modalComanda.addEventListener(
    "click",
    evento => {

        if (
            evento.target ===
            modalComanda
        ) {

            fecharComanda();

        }

    }
);


/* =========================================
   ESC PARA FECHAR
========================================= */

document.addEventListener(
    "keydown",
    evento => {

        if (
            evento.key === "Escape"
        ) {

            fecharComanda();

        }

    }
);


/* =========================================
   TROCAR MÊS
========================================= */

seletorMes.addEventListener(
    "change",
    mostrarVendas
);


/* =========================================
   INICIAR
========================================= */

criarMeses();

carregarSaidas();


/* =========================================
   DISPONIBILIZAR FUNÇÕES PARA OS BOTÕES
========================================= */

window.verComanda =
    verComanda;

window.fecharComanda =
    fecharComanda;

window.excluirVenda =
    excluirVenda;

</script>

</body>

</html>
